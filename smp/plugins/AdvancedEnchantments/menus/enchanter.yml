# Configuration for Enchanter
#  Change commands how to access it in top of config.yml

# set to "none" to disable
open-sound: "ENDERDRAGON_WINGS"
# In what worlds enchanter is disabled
disabled-in-worlds:
  - "bad_world"
messages:
  sound: ENTITY_PLAYER_LEVELUP
right-click-to-view-enchants: true
go-back-item:
  enabled: true
  item:
    type: NETHER_STAR
    id: 0
    custom-model-data: 0
  name: "&c&lGo Back"
  lore: [ ]
# Should enchanter stay open after item is bought?
keep-open: true
# Enchanter inventory size
# 9-18-27-36-45-54
#
# Placeholders:
#  %group-enchant-count% - number of enchants in the group
#  %price% - price
#  %left% - remaining needed exp until player can purchase item
# Economy:
# exp, money, level, souls (works with items that are held when opening inventory), diamonds, gold (gold ingots), emeralds
inventory:
  size: 18
  name: "&7Books Dealer"
  settings:
    enchanterBookLevel: "ALL"
  items:
    0-17:
      item:
        type: STAINED_GLASS_PANE
        id: 7
        custom-model-data: 0
        force-glow: false
      name: " "
      lore: [ ]
    1:
      item:
        type: STAINED_GLASS_PANE
        id: 8
        custom-model-data: 0
        force-glow: false
      enchant-group: COMMON
      price: exp:500
      sound: BLOCK_ANVIL_LAND
      name: "&7&lCommon Book &7(Right Click)"
      lore:
        - "&7Receive a random common"
        - "&7enchantment book."
        - ""
        - "&b&lCOST &f%price% EXP &7(You need %left% more)"
    3:
      item:
        type: STAINED_GLASS_PANE
        id: 5
        custom-model-data: 0
        force-glow: false
      enchant-group: RARE
      price: exp:2000
      sound: BLOCK_ANVIL_LAND
      name: "&a&lRare Book &7(Right Click)"
      lore:
        - "&7Receive a random rare"
        - "&aenchantment book."
        - ""
        - "&b&lCOST &f%price% EXP &7(You need %left% more)"
    5:
      item:
        type: STAINED_GLASS_PANE
        id: 11
        custom-model-data: 0
        force-glow: false
      enchant-group: EPIC
      price: exp:8000
      sound: BLOCK_ANVIL_LAND
      name: "&9&lEpic Book &7(Right Click)"
      lore:
        - "&7Receive a random epic"
        - "&9enchantment book."
        - ""
        - "&b&lCOST &f%price% EXP &7(You need %left% more)"
    7:
      item:
        type: STAINED_GLASS_PANE
        id: 1
        custom-model-data: 0
        force-glow: false
      enchant-group: LEGENDARY
      price: exp:25000
      sound: BLOCK_ANVIL_LAND
      name: "&6&lLegendary Book &7(Right Click)"
      lore:
        - "&7Receive a random legendary"
        - "&6enchantment book."
        - ""
        - "&b&lCOST &f%price% EXP &7(You need %left% more)"

# Confirmation inventory for enchanter payments
# Confirm or deny the transaction, acts like 2-step confirmation
confirmation-inventory:
  enabled: true
  name: "&aConfirmation Inventory"
  accept:
    material: STAINED_GLASS_PANE
    damage: 5
    name: "&aAccept Transaction"
    lore:
      - "&7Click this to pay %price% with %paymentType%"
  cancel:
    material: STAINED_GLASS_PANE
    damage: 14
    name: "&cClick to cancel"
    lore: [ ]
