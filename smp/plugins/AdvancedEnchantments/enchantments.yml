# ============================================================
# AdvancedEnchantments - enchantments.yml (Nomonom SMP)
# 4 Tiers: COMMON | RARE | EPIC | LEGENDARY
#
# No soul system — balance via chance% and cooldown only.
#
# LEGENDARY section comment and header cleaned up — souls fully removed.
# ============================================================

# ============================================================
# COMMON — Basic QoL, no soul cost
# ============================================================

replanter:
  display: '%group-color%Replanter'
  description: Automatically replants crops when harvested.
  applies-to: Hoes
  type: MINING
  group: COMMON
  applies:
    - ALL_HOE
  levels:
    '1':
      conditions:
        - '%is crop% = false : %stop%'
        - '%is fully grown% = false : %stop%'
      effects:
        - PLANT_SEEDS:0:%block drop type%
        - PARTICLE:HAPPY_VILLAGER:3:0
        - PLAY_SOUND:BLOCK_GRASS_PLACE

smelting:
  display: '%group-color%Smelting'
  description: Chance to automatically smelt mined blocks.
  applies-to: Pickaxes, Shovels
  type: MINING
  group: COMMON
  applies:
    - ALL_PICKAXE
    - ALL_SHOVEL
  levels:
    '1':
      chance: 33
      effects:
        - SMELT
        - PARTICLE:FLAME:4:0.3
        - PLAY_SOUND:BLOCK_FIRE_AMBIENT
    '2':
      chance: 66
      effects:
        - SMELT
        - PARTICLE:FLAME:4:0.3
        - PLAY_SOUND:BLOCK_FIRE_AMBIENT
    '3':
      chance: 100
      effects:
        - SMELT
        - PARTICLE:FLAME:5:0.3
        - PLAY_SOUND:BLOCK_FIRE_AMBIENT

glowing:
  display: '%group-color%Glowing'
  description: Grants permanent night vision.
  applies-to: Helmets
  type: EFFECT_STATIC
  group: COMMON
  applies:
    - ALL_HELMET
  levels:
    '1':
      effects:
        - POTION:NIGHT_VISION:0


