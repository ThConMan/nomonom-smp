permissions:
  add_bounty: "ultrabounty.add"
  check_bounty: "ultrabounty.check"
  list_bounties: "ultrabounty.list"
  admin: "ultrabounty.admin"
  reload: "ultrabounty.reload"
  notax: "ultrabounty.notax"