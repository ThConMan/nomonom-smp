database:
  # Database type: mysql or sqlite
  type: sqlite
  # MySQL settings (only used if type is mysql)
  host: localhost
  port: 3306
  database: ultrabounty
  username: "REPLACE_ME_DB_USER"
  password: "REPLACE_ME_DB_PASSWORD"

bounty:
  # Minimum amount that can be added (0 to disable)
  minimum-addable: 0.0
  # Maximum amount that can be added (0 to disable)
  maximum-addable: 0.0

# Broadcast Settings
broadcast:
  # Enable/disable broadcast feature
  enabled: true
  1:
    threshold: 5000000.0
    bounty-broadcast: '&#FF6B35⚠ &#FFD700LEGENDARY BOUNTY ALERT! &#FF6B35⚠ &#FFFFFF%target% now has a &#FF0000$%amount% &#FFFFFFbounty on their head! &#32CD32This is a MASSIVE reward!'
    bounty-broadcast-actionbar: '&#FF0000LEGENDARY BOUNTY: &#FFFFFF%target% - $%amount%'
  2:
    threshold: 2000000.0
    bounty-broadcast: '&#FF6B35⚠ &#FFD700MASSIVE BOUNTY ALERT! &#FF6B35⚠ &#FFFFFF%target% now has a &#FF0000$%amount% &#FFFFFFbounty on their head! &#32CD32Hunt them down!'
    bounty-broadcast-actionbar: '&#FF0000MASSIVE BOUNTY: &#FFFFFF%target% - $%amount%'
  3:
    threshold: 500000.0
    bounty-broadcast: '&#FF6B35⚠ &#FFD700HIGH BOUNTY ALERT! &#FF6B35⚠ &#FFFFFF%target% now has a &#FF0000$%amount% &#FFFFFFbounty on their head!'
    bounty-broadcast-actionbar: '&#FF0000HIGH BOUNTY: &#FFFFFF%target% - $%amount%'

gui:
  confirm_title: "ᴄᴏɴꜰɪʀᴍ ʙᴏᴜɴᴛʏ"
  list_title_prefix: "ʙᴏᴜɴᴛɪᴇꜱ (Page "

confirm-gui: true
enable-money-decimals: false
allow-bounty-removal: false
self-bounty: false
self-kill-bounty-claim: false
max_bounties_per_page: 45
debug_mode: false

# Tax Settings
tax:
  enabled: false
  percentage: 10.0
  message-enabled: true

# Sound Settings
successful:
  enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  volume: 1.0
  pitch: 1.0

ui-click:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 0.5
  pitch: 1.0

error:
  enabled: true
  sound: ENTITY_VILLAGER_NO
  volume: 1.0
  pitch: 1.0

# Placeholder Settings
placeholders:
  has_bounty:
    true: "&#00FF12&lTRUE"
    false: "&#FF0000&lFALSE"

messages:
  action-bar-messages: true
  chat-messages: true

  reload: '&#8af313UltraBounty has been reloaded successfully!'
  reload-actionbar: '&#8af313Plugin reloaded!'

  search: '&#a8a8a8Please type the player name you want to search for in chat.'
  search-actionbar: '&#a8a8a8Type player name in chat...'

  search-history: '&#a8a8a8Please type the player name you want to search for in history.'
  search-history-actionbar: '&#a8a8a8Type player name for history search...'

  cannot-add-to-self: '&#f80000You can''t add bounty to yourself!'
  cannot-add-to-self-actionbar: '&#f80000Self-bounty not allowed!'

  cannot-remove-bounty: '&#f80000Bounty removal is disabled on this server!'
