  invalid_check_usage-actionbar: "&#f80000Use: /bounty check <player>"

  bounty_cancelled: "&#f80000Bounty placement cancelled."
  bounty_cancelled-actionbar: "&#f80000Bounty cancelled!"

  bounty_check: "&#8af313%player% has a bounty of $%amount%."
  bounty_check-actionbar: "&#8af313%player%: $%amount% bounty"

  bounty_collected: "&#8af313You've collected a bounty of $%amount% for killing %player%!"
  bounty_collected-actionbar: "&#8af313+$%amount% from %player%!"

  bounty_lost: "&#f80000You were killed by %player% and lost your bounty of $%amount%."
