############################
#
# ITSMYSTUDIO - Configuration for Jobs
# https://itsmy.studio/discord
#
############################
builder:
  fullname: "Builder"
  shortname: B
  description: 'Construct buildings and sculpt terrain block by block.'
  ChatColour: DARK_GREEN
  BossBarColour: DARK_GREEN
  chat-display: shortfull

  # Make it actually worth running
  max-level: 48
  vip-max-level: 250

  leveling-progression-equation: 13*(joblevel)+(joblevel*joblevel*50)
  income-progression-equation: baseincome+(baseincome*(joblevel-2)*0.01)-((baseincome+(baseincome*(joblevel-2)*0.01)) * ((numjobs-1)*0.01))
  points-progression-equation: basepoints+(basepoints*(joblevel-2)*0.01)-((basepoints+(basepoints*(joblevel-2)*0.01)) * ((numjobs-1)*0.01))
  experience-progression-equation: baseexperience-(baseexperience*((numjobs-1) *0.01))

  rejoinCooldown: 5
  maxDailyQuests: 1

  Quests:
    '1':
      Name: "Builder - Easy"
      Objectives:
      - Place;stripped_oak_wood;64
      - Place;stripped_spruce_wood;64
      RewardAmount: 350
      RewardCommands:
      - itsmyconfig message [playerName] <p:prefix> You have completed your job daily quest and received your reward. <click:run_command:'/jobs quests'><p:primary-color>[✎ View the Quests]</p></click><sound:entity.villager.work_toolsmith>
      RewardDesc:
      - "%imc_dark-color_c%Complete the following quest"
      - "%imc_dark-color_c%and you will get rewarded."
      - ''
      - '%imc_text-color_c% • Rewards: %imc_eco-format_c_350%'

