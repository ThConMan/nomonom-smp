#
# "ANSI Shadow" from http://patorjk.com/software/taag/
# Wiki: https://eproject.gitbook.io/eshulkerbox/
# --
# General configuration
# --
# After change, reload needed! [/eshulkerbox reload]
# Websites:
# https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html

# Will the plugin be enabled? After change, restart needed!
enabled: true

# If enabled, the inventory title shown when opening a shulker box
# will match the item's custom name (e.g., renamed using an anvil).
# If disabled, the default title (e.g., "Shulker Box") will be used instead.
inventory-title-as-item-name: true

# Allows opening read-only Shulker Boxes inside other plugins' inventories (e.g., GUI menus like some Auctions plugins with gui).
# When set to true, players can open read-only Shulker Boxes even when they are shown inside external plugin inventories.
# ⚠️ Warning: Enabling this may cause compatibility issues or break GUI logic in some third-party plugins.
# It is recommended to keep this set to false unless you fully understand the consequences.
clickable-read-only-shulker-cross-others-plugin-inventories: false

# If set to true, the plugin will block all players chat messages and command when they are inside a ShulkerBox
disable-chat-and-commands-in-shulkerbox: true

# Aggressive inventory update (Use it only if you have problems with external plugins)
aggressive-inventory-update: false

# If set to true, the plugin will send message everytime the plugin is not updated
check-for-updates: true

# Will the plugin support custom ShulkerBoxes?
# You are able to create your own custom ShulkerBoxes that can support CustomModelData and much more!
# More info: https://eproject.gitbook.io/eshulkerbox/custom-shulkerboxes
allow-custom-shulker-boxes: true

# Will the plugin need permission to open ShulkerBoxes?
# Permission: eshulkerbox.open
default-require-permission-to-open: false

# Default cooldown of each ShulkerBox (in miliseconds) -> 1s = 1000ms
default-cooldown: 1000

# Default sound that will play when the player opens a ShulkerBox
# If you want to disable the sound, set it to "NONE"
# Default: BLOCK_SHULKER_BOX_OPEN
default-open-sound: "BLOCK_SHULKER_BOX_OPEN"

# Default sound that will play when the player closes a ShulkerBox
# If you want to disable the sound, set it to "NONE"
# Default: BLOCK_SHULKER_BOX_CLOSE
default-close-sound: "BLOCK_SHULKER_BOX_CLOSE"

# Pitch of the sound when opening a shulker box
# Default: 1.0
default-open-pitch: 1.0

# Pitch of the sound when closing a shulker box
# Default: 1.0
default-close-pitch: 1.0

# Volume of the sound when opening a shulker box
# Default: 1.0
default-open-volume: 0.25

# Volume of the sound when closing a shulker box
# Default: 1.0
default-close-volume: 0.25

# If set to true, all shulker boxes can be opened by right clicking them
# If set to false, only custom shulker boxes with the option "openable-by-interact" can be opened by right clicking them
# Default: true
all-boxes-are-openable-by-interact: true

# If set to true, all shulker boxes can be opened by right clicking them in inventory
# If set to false, only custom shulker boxes with the option "clickable-open" can be opened by right clicking them in inventory
# Default: true
all-boxes-are-clickable-open: true

# If set to true, you can open shulker boxes by right-clicking them in inventory
default-clickable-open: true

# If set to true, you cant take items from shulker boxes
default-read-only: false

# Openable enderchest
# Default: false
openable-enderchest-by-interact: false

# Disable the plugin for specific worlds
# If you want to disable the plugin for a specific world, add the world name to the list
disabled-worlds:
  - "spawn1"
  - "spawn2"

# Disable the plugin for specific regions
# If you want to disable the plugin for a specific region, add the region name to the list
disabled-regions:
  - "spawn1"


# Blocked items that cannot be placed in the normal ShulkerBoxes (not custom ones)
#blocked-items:
#  - "BEDROCK"               # Bedrock Material will be blocked
#  - "CustomModelData:24756" # All Items with CustomModelData 24756 will be blocked

# Maximum of carried shulker boxes in the inventory
maximum-carried-shulker-boxes:
  enabled: false # THIS FEATURE IS AVAILABLE ONLY FOR PREMIUM USERS!
  block-when-exceeding: true # If set to true, players will not be able to carry more than the maximum number of shulker boxes (If set to false, players will be able to carry more than the maximum number of shulker boxes, but it will call actions so you can make your own security)
  # This actions will be called only when block-when-exceeding is set to false
  actions:
    exceeded:
      - "[CHAT] Hi, I was trying to carry more than max shulker boxes.. :("
      - "[CONSOLE] effect give %player% minecraft:slowness 5 255 true"
      - "[CONSOLE] tellraw %player% {\"text\":\"You can't carry more than %max% shulker boxes!\",\"color\":\"red\"}"
    dropped:
      - "[CHAT] You have dropped your shulker boxes because you were carrying too many!"
      - "[CONSOLE] tellraw %player% {\"text\":\"You have dropped your shulker boxes because you were carrying too many!\",\"color\":\"red\"}"
      - "[CONSOLE] effect %player% minecraft:slowness 0"
  # eshulkerbox.maximum-carried-shulker-boxes.<number>g
  # Example: eshulkerbox.maximum-carried-shulker-boxes.3 -> Players with that permission can carry up to 3 shulker boxes
