Erius_Spawn:
  Type: ARMOR_STAND
  Display: '&6Erius_Spawn'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - skill{s=erius_spawn} @self ~onTimer:20
  
Erius:
  Type: husk
  Display: '&6Erius'
  Health: 300
  Damage: 1
  Faction: Erius
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: true
    PreventOtherDrops: true
    Silent: true
    FollowRange: 32
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.3
    KnockbackResistance: 1
    Despawn: false
    Persistent: true
  BossBar:
    Enabled: true
    Title: '&6Erius'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  Modules:
    ThreatTable: true
  Skills:
  - model{mid=Erius;ride=true;drive=true} @self ~onSpawn
  - sound{s=erius.fire_ring;v=4;p=1;delay=20} @self ~onDeath
  - sound{s=erius.fire_ring;v=4;p=1} @self ~onSpawn
  - partvis{mid=Erius;p=fire_ring;v=true;child=true} @self ~onSpawn
  - partvis{mid=Erius;p=fire_ring;v=false;child=true;delay=60} @self ~onSpawn
  - partvis{mid=Erius;p=fire_ring;v=true;child=true;delay=20} @self ~onDeath
  - partvis{mid=Erius;p=fire_ring;v=false;child=true;delay=60} @self ~onDeath
  - partvis{mid=Erius;p=main_fire_wall;v=false;child=true} @self ~onSpawn
  - setAI{ai=false} @self ~onSpawn
  - setspeed{type=walking;speed=1} @self  ~onSpawn
  - gcd{ticks=60} @self ~onSpawn
  - setAI{ai=true;delay=60} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - skill{s=erius_meteors} @RandomLocationsNearCaster{a=3;r=32} ~onTimer:5
  - randomskill{s=erius_range_attack1,erius_meteor_attack,erius_fire_ring_attack,erius_levitation_throw,erius_fire_wall,erius_phoenix_summon} @target ~onTimer:10
  
Erius_fireball:
  Type: ARMOR_STAND
  Display: '&6Erius fireball'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - model{mid=Erius_fire_projectile} @self ~onSpawn
  - effect:particles{p=flame;hs=0.4;vs=0.4;a=1} @self ~onTimer:5
  - effect:particles{p=smoke;hs=0.4;vs=0.4;a=2} @self ~onTimer:5
  
Erius_vertical_fireball:
  Type: ARMOR_STAND
  Display: '&6Erius fireball'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - model{mid=Erius_fire_vertical_projectile} @self ~onSpawn
  - effect:particles{p=flame;hs=0.5;vs=0.5;a=1} @self ~onTimer:10
  - effect:particles{p=smoke;hs=0.5;vs=0.5;a=2} @self ~onTimer:10
  
Erius_phoenix:
  Type: VEX
  Display: '&6Erius phoenix'
  Health: 5
  Faction: Erius
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: false
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventRandomEquipment: true
    KnockbackResistance: 1
    PreventSunburn: true
    Silent: true
    FollowRange: 128
  Skills:
  - model{mid=Erius_phoenix;n=false} @self ~onSpawn
  - setAI{ai=false} @self ~onSpawn
  - setAI{ai=true;delay=13} @self ~onSpawn
  - skill{s=erius_phoenix_attack} @target
  - CancelEvent{sync=true} @self ~onAttack
  - effect:particles{p=flame;hs=0.4;vs=0.4;a=1} @self ~onTimer:10
  - effect:particles{p=smoke;hs=0.4;vs=0.4;a=2} @self ~onTimer:10
  - effect:particles{p=flame;hs=0.2;vs=0.2;a=15;s=0.2} @self ~onDeath
  - effect:particles{p=large_smoke;hs=0.2;vs=0.2;a=15;s=0.2} @self ~onDeath 
  - sound{s=erius.phoenix_flap;v=2;p=1} @self ~onTimer:20
  - sound{s=entity.generic.extinguish_fire;v=2;p=1} @self ~onDeath 
  