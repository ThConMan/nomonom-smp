Anubis_spawn:
  Type: ARMOR_STAND
  Display: '&6Anubis_Spawn'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - skill{s=anubis_spawn} @self ~onTimer:20
  
Anubis:
  Type: husk
  Display: '&6Anubis'
  Health: 400
  Damage: 1
  Faction: Anubis
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: true
    PreventOtherDrops: true
    Silent: true
    FollowRange: 32
    PreventItemPickup: true
    PreventRandomEquipment: true
    Despawn: false
    Persistent: true
    MovementSpeed: 0.3
    KnockbackResistance: 1
    Collidable: true
  BossBar:
    Enabled: true
    Title: '&6Anubis'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  Modules:
    ThreatTable: true
  Skills:
  - model{mid=Anubis;ride=true;drive=true;s=1} @self ~onSpawn
  - partvis{mid=Anubis;p=scales;v=false;child=true} @self ~onSpawn
  - partvis{mid=Anubis;p=amat_head;v=false;child=true} @self ~onSpawn 
  - partvis{mid=Anubis;p=scales_heart4;v=false;child=true} @self ~onSpawn 
  - partvis{mid=Anubis;p=main_sand;v=false;child=true} @self ~onSpawn 
  - partvis{mid=Anubis;p=claw;v=false;child=true} @self ~onSpawn
  - partvis{mid=Anubis;p=sandstorm2;v=false;child=true;delay=80} @self ~onSpawn 
  - setAI{ai=false} @self ~onSpawn
  - setspeed{type=walking;speed=1} @self ~onSpawn
  - gcd{ticks=80} @self ~onSpawn
  - setAI{ai=true;delay=80} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - skill{s=anubis_counterattack} @target ~onDamaged
  - skill{s=anubis_stun} @target ~onDamaged
  - skill{s=anubis_jump_back} @target ~onTimer:10
  - skill{s=anubis_step} @self ~onTimer:20
  - randomskill{s=anubis_roar,anubis_attack1,anubis_justice_try,anubis_sandstorm_summon,anubis_claw_attack} @target ~onTimer:10
  - sound{s=block.sand.step;v=2;p=0.5;delay=5} @self ~onDeath
  - sound{s=block.sand.step;v=2;p=0.1;delay=70} @self ~onDeath
  - potion{type=DAMAGE_RESISTANCE;duration=80;level=100;p=false} @self ~onSpawn
  - BodyClamp{mh=25;mb=25;rde=60;rdu=60} @self ~onSpawn
  
Anubis_sandstorm:
  Type: ARMOR_STAND
  Display: '&6Anubis_sandstorm'
  Faction: Anubis
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
    Collidable: false
  Skills:
  - sound{s=anubis.sandstorm;v=3;p=1} @self ~onSpawn
  - model{m=Anubis_sandstorm} @self ~onSpawn
  - remove{delay=250} @self ~onSpawn
  - Aura{auraName=anubis_sandstorm_aura;onTick=anubis_sandstorm_aura_tick;interval=1;duration=220;delay=5} @self ~onSpawn
  
Anubis_roar_projectile:
  Type: ARMOR_STAND
  Options:
    Collidable: false
    Invisible: true
  Skills:
  