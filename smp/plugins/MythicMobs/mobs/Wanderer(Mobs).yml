Wanderer_spawn:
  Type: ARMOR_STAND
  Display: '&6Anubis_Spawn'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - skill{s=wanderer_spawn} @self ~onTimer:20  
  
Wanderer:
  Type: husk
  Display: '&6Wanderer'
  Health: 400
  Damage: 1
  Faction: Wanderer
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: true
    PreventOtherDrops: true
    Silent: true
    FollowRange: 32
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.3
    KnockbackResistance: 1
    Collidable: true
  BossBar:
    Enabled: true
    Title: '&6Wanderer'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  Modules:
    ThreatTable: true
  Skills:
  - model{mid=Wanderer;ride=true;drive=true;s=1} @self ~onSpawn
  - BodyClamp{mh=15} @self ~onSpawn
  - partvis{mid=Wanderer;p=blocks1;v=false;child=true} @self ~onSpawn
  - partvis{mid=Wanderer;p=block9;v=false;child=true;delay=95} @self ~onSpawn
  - partvis{mid=Wanderer;p=blocks1;v=true;child=true;delay=5} @self ~onDeath
  - partvis{mid=Wanderer;p=left_chain;v=false;child=true} @self ~onDeath
  - setAI{ai=false} @self ~onSpawn
  - setspeed{type=walking;speed=1} @self ~onSpawn
  - gcd{ticks=90} @self ~onSpawn
  - setAI{ai=true;delay=90} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - sound{s=block.basalt.break;v=2;p=1.5} @self ~onDamaged
  - sound{s=block.basalt.step;v=2;p=0.1;delay=90} @self ~onSpawn
  - sound{s=block.basalt.step;v=2;p=0.1;delay=5} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.7;delay=6} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.5;delay=7} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.4;delay=8} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=1;delay=9} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.1;delay=49} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.1;delay=50} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.1;delay=51} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.1;delay=60} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.1;delay=70} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.1;delay=80} @self ~onDeath
  - sound{s=block.basalt.step;v=2;p=0.1;delay=90} @self ~onDeath
  - sound{s=wanderer.block;v=2;p=1} @self ~onSpawn
  - skill{s=wanderer_step} @self ~onTimer:20
  - skill{s=wanderer_jump_back} @target ~onTimer:10
  - randomskill{s=wanderer_attack,wanderer_rush,wanderer_earth,wanderer_summon,wanderer_vines} @target ~onTimer:5
  
Wanderer_wisp:
  Type: VEX
  Display: '&Wanderer_wisp'
  Health: 1
  Faction: Wanderer
  AITargetSelectors:
  - players
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: false
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventRandomEquipment: true
    KnockbackResistance: 1
    PreventSunburn: true
    Silent: true
    FollowRange: 128
    Collidable: false
  Skills:
  - model{mid=Wanderer_wisp;n=false} @self ~onSpawn
  - setSpeed{s=5} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - effect:particles{p=soul_fire_flame;hs=0.4;vs=0.4;a=1} @self ~onTimer:10
  - effect:particles{p=smoke;hs=0.4;vs=0.4;a=2} @self ~onTimer:10
  - effect:particles{p=soul_fire_flame;hs=0.2;vs=0.2;a=15;s=0.2} @self ~onDeath
  - effect:particles{p=large_smoke;hs=0.2;vs=0.2;a=15;s=0.2} @self ~onDeath 
  - bodyclamp{m=Wanderer_wisp;c=0} @self ~onSpawn
  - skill{s=wanderer_wisp_attack} @target ~onTimer:1
  - effect:particles{p=soul_fire_flame;hs=0.2;vs=0.2;a=15;s=0.2;delay=100} @self ~onSpawn
  - effect:particles{p=large_smoke;hs=0.2;vs=0.2;a=15;s=0.2;delay=100} @self ~onSpawn
  - sound{s=entity.generic.extinguish_fire;v=1;p=1} @self ~onDeath 
  - sound{s=entity.blaze.shoot;v=1;p=1.5} @self ~onSpawn
  - sound{s=entity.generic.extinguish_fire;v=1;p=1;delay=100} @self ~onSpawn
  - remove{delay=100} @self ~onSpawn

