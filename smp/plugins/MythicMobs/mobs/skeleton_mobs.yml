# Skeleton Warrior #

Skeleton_Warrior:
  Type: ZOMBIE
  Display: '&fSkeleton Warrior'
  Health: 200
  Damage: '2'
  Faction: Skeleton
  Options:
    MovementSpeed: 0.25
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: true
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 20
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  Drops:
  - skeleton_sword 1 1
  - skeleton_shield 1 1
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=skeleton_warrior;n=false;step=1} @self ~onSpawn
  - effect:sound{s=rms_skeleton_sounds:samus.skeleton_idle;volume=0.7;pitch=1} @self
    ~onTimer:140 0.35
  - effect:sound{s=rms_skeleton_sounds:samus.skeleton_idle;volume=0.7;pitch=1.2} @self
    ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Skeleton_Warrior_Attack} ~onTimer:20 0.7
  - skill{s=Skeleton_Warrior_Parry} ~onDamaged 0.4
  - skill{s=Skeleton_Warrior_Hit} ~onDamaged

