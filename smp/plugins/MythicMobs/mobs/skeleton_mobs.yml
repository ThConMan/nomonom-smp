# Lich King #

Lich_King:
  Type: ZOMBIE
  Display: '&4Lich King'
  Health: 1000
  Damage: 6
  BossBar:
    Enabled: true
    Title: '&4Lich King'
    Range: 25
    Color: RED
    Style: SEGMENTED_12
    DarkenSky: false
  Options:
    MovementSpeed: 0.2
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: true
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 50
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  Drops:
  - lich_king_scythe 1 1
  DamageModifiers:
  - FALL 0
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=lich_king;n=false;step=1} @self ~onSpawn
  - effect:sound{s=rms_skeleton_sounds:samus.lich_king_idle;volume=1.5;pitch=1} @self
    ~onTimer:140 0.35
  - effect:sound{s=rms_skeleton_sounds:samus.lich_king_idle;volume=1.5;pitch=1.1}
    @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Lich_King_Attack} ~onTimer:40 0.7
  - skill{s=Lich_King_Skill} ~onTimer:60
  - skill{s=Lich_King_Hit} @self ~onDamaged

Lich_King_Shadow:
  Type: ARMOR_STAND
  Pose:
    Head: 0,0,0
  Options:
    Marker: true
    Small: false
    Invisible: true
    Invincible: true
  Skills:
