  - effect:particles{particle=smoke_large;amount=25;hS=0.6;vS=0.3;y=1;speed=0;forwardOffset=0;sideOffset=0}
    @self ~onSpawn
  - state{s=skill} @self ~onSpawn
  - remove{delay=12} @self ~onSpawn

