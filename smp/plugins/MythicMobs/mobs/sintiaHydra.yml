# SINTIA
sintiaMob:
  Type: iron_golem
  Health: 600
  Faction: SintiaHydraTeam
  Options:
    PreventBlockInfection: true
    PreventOtherDrops: true
    DigOutOfGround: true
    FollowRange: 50
    MovementSpeed: '.25'
    Collidable: true
    Despawn: false
    Silent: true
    Persistent: true
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  AITargetSelectors:
  - clear
  - players
  - attacker
  DamageModifiers:
  - FALL 0
  BossBar:
    Enabled: true
    Range: 60
    Color: PURPLE
    Style: SEGMENTED_20
    Title: Sintia, the Magic Hydra
  KillMessages:
  - <target.name> was slay by Sintia, the Magic Hydra
  Skills:
  - skill:sintiaBGSpawn @Self ~onSpawn
  - model{m=sintia_the_hydra_vfx_crystal;n=false;rad=76;d=false} @Self ~onLoad
  - skill{s=[ - cancelevent @Self - skill:sintiaBGThrowPlayer @PIR{r=15;ignore=creative,spectators}
    ];sync=true} ~onAttack
  - skill:sintiaBGTakeDamaged ~onDamaged
  - skill:sintiaBGFuryPhase ~onDamaged =50%
  - skill:sintiaBGFuryPhase ~onDamaged =25%
  - skill:sintiaBGRunFastWalk @PIR{r=30;ignore=creative,spectators} ~onTimer:75 0.93
  - skill:sintiaBGRandomBiteAttack @PIR{r=20;ignore=creative,spectators} ~onTimer:59
    0.84
  - randomskill{s=sintiaBGCrystalAttackI,sintiaBGCrystalAttackIII} @PIR{r=30;ignore=creative,spectators}
    ~onTimer:95 0.75
  - skill:sintiaBGCrystalAttackII ~onDamaged 0.23
  - skill:sintiaBGStampede ~onTimer:120 0.85
  - skill:sintiaBGStampede ~onDamaged 0.1
  - skill:sintiaBGDelusionalInvisibility ~onTimer:120 0.88 <95%
  - skill:sintiaBGMagicalBreath @PIR{r=45;ignore=creative,spectators} ~onTimer:95
    0.89
  - skill:sintiaBGProdigalRain @Self ~onDamaged 0.44 <90%
  - skill:sintiaBGMagicCircles @Self ~onTimer:95 0.84 <98%
  - skill:sintiaBGDeath{sync=true} ~onDeath
  Drops:
  - sintiaBGHat 1 1
  Damage: '50'
  Armor: '40'
sintiaCrystalDummy:
  Type: silverfish
  Faction: SintiaHydraTeam
  Options:
    PreventBlockInfection: true
    PreventOtherDrops: true
    Invincible: true
    Collidable: false
    KnockbackResistance: 0.01
    Despawn: false
    Silent: true
    NoAI: true
  KillMessages:
  - <target.name> was slay by Sintia, the Magic Hydra
  Skills:
  - skill{s=[ - skill:sintiaBGDamageConfigII @Self - skill:sintiaCrystalProjectileBGCrystalSpawn
    ]} ~onSpawn
sintiaCrystalMagicCircleDummy:
  Type: silverfish
  Faction: SintiaHydraTeam
  Options:
    PreventBlockInfection: true
    PreventOtherDrops: true
    Invincible: true
    Collidable: false
    KnockbackResistance: 0.01
    Despawn: false
    Silent: true
  KillMessages:
  - <target.name> was slay by Sintia, the Magic Hydra
  Skills:
  - skill{s=[ - skill:sintiaBGDamageConfigIII @Self - skill:sintiaCrystalMagicCircleDummySpawn
    ]} ~onSpawn
