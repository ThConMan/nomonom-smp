hv_vespera_spawn:
  Type: ARMOR_STAND
  Display: '&6Vespera'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - skill{s=hv_vespera_spawn} @self ~onTimer:20
  
hv_vespera:
  Type: husk
  Display: '&6Vespera'

  Health: 500
  Faction: hv_vespera
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: true
    Despawn: false
    Persistent: true
    PreventOtherDrops: true
    Silent: true
    FollowRange: 32
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 1
    KnockbackResistance: 1
    Collidable: false
  BossBar:
    Enabled: true
    Title: '&6Vespera'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  Skills:
  - model{mid=hv_vespera;ride=true;drive=true;s=1} @self ~onSpawn
  - model{mid=hv_vespera;ride=true;drive=true;s=1} @self ~onLoad
  - partvis{mid=hv_vespera;p=spirit_projectile;v=false;child=true} @self ~onSpawn
  - partvis{mid=hv_vespera;p=spirits;v=false;child=true} @self ~onLoad
  - partvis{mid=hv_vespera;p=spirits;v=false;child=true} @self ~onSpawn
  - partvis{mid=hv_vespera;p=spirit_projectile;v=false;child=true} @self ~onLoad
  - partvis{mid=hv_vespera;p=stars;v=false;child=true} @self ~onSpawn
  - partvis{mid=hv_vespera;p=stars;v=false;child=true} @self ~onLoad
  - partvis{mid=hv_vespera;p=blades_right_main;v=false;child=true} @self ~onSpawn
  - partvis{mid=hv_vespera;p=blades_right_main;v=false;child=true} @self ~onLoad
  - partvis{mid=hv_vespera;p=blade2;v=false;child=true} @self ~onSpawn
  - partvis{mid=hv_vespera;p=blade2;v=false;child=true} @self ~onLoad
  - partvis{mid=hv_vespera;p=shadow_ring;v=false;child=true} @self ~onSpawn
  - partvis{mid=hv_vespera;p=shadow_ring;v=false;child=true} @self ~onLoad
  - BodyClamp{mh=25;rde=0;rdu=0} @self ~onSpawn
  - BodyClamp{mh=25;rde=0;rdu=0} @self ~onLoad
  - gcd{ticks=100} @self ~onSpawn
  - setspeed{s=0} @self ~onSpawn
  - setspeed{s=1;delay=95} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  #- skill{s=hv_vespera_shadow_storm} @target ~onTimer:20
  - skill{s=hv_vespera_spawn2} @self ~onSpawn
  - skill{s=hv_vespera_stun} @target ~onDamaged
  - skill{s=hv_vespera_death} @self ~onDeath
  - skill{s=hv_vespera_talks} @target ~onTimer:20
  - randomskill{s=hv_vespera_grab_try,hv_vespera_shoot,hv_vespera_shadow_storm,hv_vespera_summon_bat,hv_vespera_blades,hv_vespera_shadow_ring} @target ~onTimer:10
  
hv_vespera_bat:
  Type: VEX
  Display: '&6Vespera'
  Health: 5
  Faction: hv_vespera
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: false
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventRandomEquipment: true
    KnockbackResistance: 1
    PreventSunburn: true
    Silent: true
    FollowRange: 128
  Skills:
  - model{mid=hv_vespera_bat;n=false;ride=true;drive=true;s=1} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - skill{s=hv_vespera_bat_attack} @target ~onAttack
  - sound{s=entity.bat.ambient;v=2;p=1} @self ~onTimer:60
  - effect:particles{p=smoke;hs=0.4;vs=0.4;a=2} @self ~onTimer:10
  - effect:particles{p=large_smoke;hs=0.2;vs=0.2;a=15;s=0.2} @self ~onDeath 
  - sound{s=entity.bat.death;v=2;p=0.5} @self ~onDeath 
  - remove{delay=3600} @self ~onSpawn # 3 minutes
  
hv_vespera_projectile:
  Type: ARMOR_STAND
  Display: '&6Vespera'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - model{mid=hv_vespera_projectile} @self ~onSpawn
  - effect:particles{p=smoke;hs=0.4;vs=0.4;a=2} @self ~onTimer:5
  
hv_vespera_blade:
  Type: ARMOR_STAND
  Display: '&6Vespera'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - model{mid=hv_vespera_blade} @self ~onSpawn
  - effect:particles{p=smoke;hs=0.4;vs=0.4;a=2} @self ~onTimer:5

