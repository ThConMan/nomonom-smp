#
# 5-1. CrystalRock
#
CrystalRock:
  Type: husk
  Display: '&fCrystalRock'
  Health: 60
  Damage: 7
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 attacker
  - 2 players
  Options:
    Despawn: true
    Persistent: true
    MovementSpeed: 0.2
    Armor: 12
    DamageReduction: 0.35
    KnockbackResistance: 0.6
    PreventOtherDrops: true
    Silent: true
    Invisible: true
    FollowRange: 16
    PreventItemPickup: true
    PreventRandomEquipment: true
    PreventJockeyMounts: true
    LockPitch: true #Requires ProtocolLib
    UseVanillaSpawning: true
    Experience: 40
  Skills:
  - model{mid=lostasset_mob5_CrystalRock;i=true} @self ~onSpawn
  - model{mid=lostasset_mob5_CrystalRock;i=true} @self ~onSpawn ~delay:10
  - model{mid=lostasset_mob5_CrystalRock;i=true} @self ~onLoad
  - model{mid=lostasset_mob5_CrystalRock;i=true} @self ~onTimer:200
  - CancelEvent{sync=true} @self ~onAttack
  - setstance{stance=Combat;delay=40} @self ~onSpawn
  - skill{s=lostasset_mobs5_CrystalRock_atk} ~onTimer:2
  Drops:
  # Ascended Shards: Wither-skull-ish but a tad rarer (mobs are everywhere)
  - mmoitems{type=MATERIAL;id=ASCENDED_SHARDS} 1 1.8%
  # small bonus roll (rare double drop)
  - mmoitems{type=MATERIAL;id=ASCENDED_SHARDS} 1 0.18%
