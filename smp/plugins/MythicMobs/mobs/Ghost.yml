Ghost:
  Type: VEX
  Display: "Ghost"
  Health: 3
  Damage: 1
  Options:
    Silent: true
    PreventOtherDrops: true
    PreventBlockInfection: true
    MovementSpeed: .16
    Collidable: true
    Despawn: false
    Persistent: true
    AlwaysShowName: true
  Skills:
  - model{mid=Ghost;n=name} @self ~onSpawn
  - model{mid=Ghost;n=name} @self ~onLoad
  - state{s=attack} @self ~onAttack
  - effect:particles{particle=poof;amount=2;hS=.15;vS=.15} @self ~onTimer:1
  - effect:particles{particle=soul;amount=1;hS=.25;vS=.15} @self ~onTimer:1
  - setname{n=<target.name>} @playersonserver{limit=1;sort=RANDOM} ~onSpawn