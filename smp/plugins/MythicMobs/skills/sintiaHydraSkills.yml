#SINTIA THE MAGIC HYDRA
####################################################################################################################################################
#SKILLS DAMAGE CONFIG 
sintiaBGDamageConfig:
  Skills:
  # NORMALS                                                                            
  - setvariable{var=caster.sintiaBGMeleeAttackDamage;val=40} #<-- amount | Bite attacks | 
  - setvariable{var=caster.sintiaBGGroundImpactDamage;val=40} #<-- amount | Ground impacts | 
  - setvariable{var=caster.sintiaBGStampedeDamage;val=40} #<-- amount | Stampede attack | 
  - setvariable{var=caster.sintiaBGCrystalsAttackDamage;val=40} #<-- amount | Crystal attacks |   
  # SPECIALS                                                                         
  - setvariable{var=caster.sintiaBGMagicalBreathDamage;val=40} #<-- amount | Magical breath |       | Title = Line 637 |
  - setvariable{var=caster.sintiaBGProdigalRainDamage;val=40} #<-- amount | Prodigal rain |        | Title = Line 901 |
  #------------------------------------------------------------| Delusional Invisibility |         | Title = Line 700 |
  #------------------------------------------------------------| Fury |                            | Title = Line 1306 - 1307 |
  #------------------------------------------------------------| Fury |                            | Message = Line 1244 - 1245 |
sintiaBGDamageConfigII:
  Skills:
  - setvariable{var=caster.sintiaBGCrystalsAttackDamageII;val=15} #<-- amount | Crystal attacks |   
sintiaBGDamageConfigIII:
  Skills:
  - setvariable{var=caster.sintiaBGMagicCirclesDamage;val=7} #<-- amount | Magic circles |
####################################################################################################################################################
sintiaBGSpawnAnimation:
  Skills:
  - sound{s=block.amethyst_block.chime;p=0.5;v=3} @Self
  - model{m=sintia_the_hydra_vfx_crystal;n=false;rad=76;d=false} @Self
  - state{s=spawn;r=true} @Self
  - state{s=sintia_spawn} @Self
sintiaBGSpawnAnimationOnDamaged:
  Skills:
  - velocity{m=set;x=0;y=0;z=0;delay=1} @Self
  - state{s=crystal_hurt} @Self
  - sound{s=block.amethyst_block.hit;p=0.8;v=3} @Self
  - effect:particlering{particle=cloud;radius=1;points=8;amount=2;hS=0.25;vS=4.90;s=0.15} @Self
  - effect:particlering{particle=firework;radius=1;points=8;amount=2;hS=0.25;vS=4.90;s=0.15} @Self
sintiaBGSpawnAnimationStart:
  Skills:
  - sound{s=block.amethyst_block.break;p=<random.float.0.5to0.9>;v=4} @Self
  - sound{s=block.glass.break;p=<random.float.0.5to0.9>;v=4} @Self
  - effect:particlering{particle=cloud;radius=0.5;points=6;amount=3;hS=0.25;vS=4.90;s=0.15} @Self
  - effect:particlering{particle=block_crack;m=purple_stained_glass;radius=0.5;points=6;amount=18;hS=0.25;vS=4.90;s=0} @Self
  - effect:particlering{particle=firework;radius=0.5;points=4;amount=4;hS=0.25;vS=0.90;s=0.15} @Self
  - summon{t=sintiaMob;onSurface=true} @SelfLocation
