  - effect:particles{p=Sweep_Attack;amount=2;hs=3;vs=1;y=0.2} 
  - damage{a=4} @self @onAttack
  - gcd{ticks=8} @self
  - state{s=e_attack_2;lo=10} @self
  - effect:sound{s=entity.player.attack.nodamage;v=1.7;p=1.1} @self
