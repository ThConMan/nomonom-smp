  - sound{s=hv_vespera.born;v=5;p=0.9} @self
  
hv_vespera_spawn:
  Cooldown: 99999
  Conditions:
  - playerwithin{d=12} true
  Skills:
  - effect:sound{s=ambient.cave;v=1.4;p=2} @PIR{r=40}
  - effect:sound{s=entity.wither.spawn;v=1;p=0.7} @PIR{r=40}
  - delay 20
  - summon{t=hv_vespera} @self
  - remove @self
  
hv_vespera_spawn2:
  Skills:
  - delay 24
  - sound{s=hv_vespera.chains_break;v=5;p=0.5} @self
  - delay 4
  - sound{s=hv_vespera.chains_break;v=5;p=0.5} @self

hv_vespera_death:
  Skills:
  - sound{s=hv_vespera.death;v=5;p=0.9} @self
  - partvis{mid=hv_vespera;p=spirit_projectile;v=false;child=true} @self
