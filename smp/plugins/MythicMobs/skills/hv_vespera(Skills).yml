hv_vespera_talks:
  Cooldown: 30
  Conditions:
  - playerwithin{d=16} true
  Skills:
  - randomskill{s=hv_vespera_talk1,hv_vespera_talk2,hv_vespera_talk3}
  
hv_vespera_talk1:
  Conditions:
  - hasaura{n=hv_vespera_stun_aura} false
  - hasaura{n=hv_vespera_talk1_aura} false
  Skills:
  - Aura{auraName=hv_vespera_talk1_aura;interval=1;duration=2400} @self
  - sound{s=hv_vespera.doom;v=5;p=0.9} @self
  
hv_vespera_talk2:
  Conditions:
  - hasaura{n=hv_vespera_stun_aura} false
  - hasaura{n=hv_vespera_talk2_aura} false
  Skills:
  - Aura{auraName=hv_vespera_talk2_aura;interval=1;duration=2400} @self
  - sound{s=hv_vespera.shackles;v=5;p=0.9} @self
    
hv_vespera_talk3:
  Conditions:
