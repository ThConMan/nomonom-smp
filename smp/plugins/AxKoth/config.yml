# DOCUMENTATION: https://docs.artillex-studios.com/axkoth.html

prefix: '<gradient:#FF2200:#FF5500><b>Koth</b></gradient> <gray>»</gray> '

# what plugin to use for these things?
# if you need another plugin supported, please contact us on discord
# note: we can only add plugins where the player can only be in a single team at once (so most land protection plugins are not possible)
hooks:
  # values:
  # - none
  # - BetterTeams
  # - GangsPlus
  # - Guilds
  # - KingdomsX
  # - FactionsUUID
  # - SuperiorSkyblock2
  # - UltimateClans
  # - SaberFactions
  # - Towny
  # - SimpleClans
  # - Parties
  # - AxParties
  team-plugin: none

hook-settings:
  BattlePass:
    register: true
  GSit:
    register: true
  DeluxeCombat:
    register: true

# the format used in placeholders
# 1 - HH:MM:SS, for example 01:25:35
# 2 - short format, for example 20m
# 3 - text format, for example 01h 25m 35s
timer-format: 1

# while capturing a koth, how often should the chat notify players about the current capture
# set to -1 to disable
capture-broadcast-every-seconds: 60

# how often should leaderboards update?
# the updates are done async
# this value only changes after a restart
leaderboard-update-seconds: 180

# how often should koth bossbars update?
# in ticks (1 second = 20 ticks)
bossbar-update-ticks: 10

# how often should koth scoreboards update?
# in ticks (1 second = 20 ticks)
scoreboard-update-ticks: 10

# if enabled, the player who is currently capturing the koth will get a glow effect
capturer-glow:
  enabled: false

database:
  # h2, sqlite, mysql
  # for single server setups we recommend h2 because it's way faster than sqlite
  type: h2
  
  # you only need to touch these when using mysql/postgresql
  address: 127.0.0.1
  port: 3306
  database: admin
  username: "REPLACE_ME_DB_USER"
  password: "REPLACE_ME_DB_PASSWORD"
  pool:
    maximum-pool-size: 10
    minimum-idle: 10
    maximum-lifetime: 1800000
    keepalive-time: 0
    connection-timeout: 5000

# requires a restart for changes to apply
command-aliases:
- axkoth
- koth

# settings for holograms displays
holograms:
  # set to 00000000 to make it invisible
  # format (hexadecimal): AARRGGBB
  background-color: 00000000
  # list: left, right, center
  alignment: center
  # list: fixed, vertical, horizontal, center
  billboard: vertical
  # should blocks/entities be visible behind the displays?
  see-through: false
  # should text have an outline?
  shadow: true

# should be plugin notify you if there is a new update?
update-notifier:
  # if enabled, it will display the message in the console
  enabled: true
  # if enabled, it will broadcast the update message to all players who have the <plugin-name>.update-notify permission
  on-join: true

# prints out a lot of random information about the plugin in the console
# this can cause a lot of spam, only use if a developer asks you to
debug: false

# do not change
version: '11'
