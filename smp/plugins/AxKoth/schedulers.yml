# DOCUMENTATION: https://docs.artillex-studios.com/axkoth.html

# list of timezones: https://docs.oracle.com/cd/E72987_01/wcs/tag-ref/MISC/TimeZones.html
# keep on 'server' to use the server machine's timezone
# some examples: Europe/Paris, America/New_York
timezone: server

# do not change
version: 1
Schedule-8am:
  times:
  - 0 13 * * 1-7
  random: false
  koths:
  - MortalKoth
Schedule-8pm:
  times:
  - 0 5 * * 1-7
  - 0 3 * * 1-7
  - 0 2 * * 1-7
  - 0 1 * * 1-7
  random: false
  koths:
  - MortalKoth
