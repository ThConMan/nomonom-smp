# to enable this remove the [] and the # from the next line
start-commands: []
#  - "say Koth started!"

end-commands: []
#  - "say Koth ended"

capture-start-commands: []
#  - "say %capturer_name% is now capturing the %name% koth!"

capture-end-commands: []
#  - "say The %name% koth is no longer being captured!"

# wiki: https://docs.artillex-studios.com/discord-webhook-builder.html
# make sure to set a webhook url, you can get an url by hovering over a channel > Edit Channel > Integrations > Create Webhook > Copy WebHook Url
webhook:
  # your webhook url here
  url: ''
  start:
    enabled: true
    content: Get ready!
    color: '#FF0000'
    title:
      text: '%name% - STARTED'
    fields:
      '1':
        inline: true
        name: Time
        value: '%timeLeft_formatted%'
  stop:
    enabled: true
    color: '#CC0000'
    title:
      text: '%name% - STOPPED'
    fields:
      '1':
        inline: true
        name: Time
        value: '%timeTaken_formatted%'
  capture-start:
    enabled: true
    color: '#AAFFAA'
    title:
      text: '%name% - CAPTURE STARTED'
    fields:
      '1':
        inline: true
        name: Capturer
        value: '%capturer_name%'
      '2':
        inline: true
        name: Team
        value: '%capturer_team_name%'
      '3':
        inline: true
        name: Time
        value: '%timeLeft_formatted%'
  capture-end:
    enabled: true
    color: '#FFAAAA'
    title:
      text: '%name% - CAPTURE STOPPED'
    fields:
      '1':
        inline: true
        name: Capturer
        value: '%capturer_name%'
      '2':
        inline: true
        name: Team
        value: '%capturer_team_name%'
      '3':
        inline: true
        name: Time
        value: '%timeLeft_formatted%'
  captured:
    enabled: true
    content: ':tada:'
    color: '#00FF00'
    title:
      text: '%name% - CAPTURED'
    fields:
      '1':
        inline: true
        name: Capturer
        value: '%capturer_name%'
      '2':
        inline: true
        name: Team
        value: '%capturer_team_name%'
      '3':
        inline: true
        name: Time
        value: '%timeTaken_formatted%'
