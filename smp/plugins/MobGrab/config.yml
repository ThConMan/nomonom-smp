# MobGrab Configuration

# Effects
pickup-sound: ENTITY_ITEM_PICKUP
place-sound: ENTITY_ENDERMAN_TELEPORT
pickup-particles: CLOUD
place-particles: HAPPY_VILLAGER
particle-count: 10

# Cooldown between pickups (seconds)
cooldown-seconds: 1

# Mob toggle mode
# false = whitelist (only mobs listed as true can be picked up)
# true  = blacklist (all mobs allowed unless listed as false)
blacklist-mode: false

# Geyser/Floodgate support
# Automatically detected if floodgate is installed
geyser:
  enabled: true
  # Number of mobs per page in Bedrock form GUI
  mobs-per-page: 20

# Per-mob toggles
