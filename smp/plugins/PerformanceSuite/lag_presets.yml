###############################################################################
# Lag Presets Library
# - Each preset bundles cleanup actions you can call from commands, GUIs, or
#   scheduled tasks. Duplicate and tweak names/descriptions to suit your server.
###############################################################################

presets:
#  drops-purge:
  #  name: "Item & XP Purge"
 #   description: "Clears all dropped items and XP orbs on the server."
  #  actions:
  #    - type: CLEAR_DROPS
   #     worlds: [all]
   #   - type: CLEAR_XP_ORBS
   #     worlds: [all]
#
  farm-purge:
    name: "Pasture Animal Cull"
    description: "Clears common farm animals globally."
    actions:
      - type: CLEAR_MOBS
        mobs: [COW, CHICKEN, PIG, SHEEP]
        ignore_named: true
        worlds: [all]

  projectile-sweep:
    name: "Projectile Lag Sweep"
    description: "Removes stray arrows, tridents, and throwable clutter."
    actions:
      - type: CLEAR_PROJECTILES
        worlds: [all]

  xp-topoff:
    name: "XP Orb Cleanup"
    description: "Clears experience orbs across all worlds."
    actions:
      - type: CLEAR_XP_ORBS
        worlds: [all]

  hostile-hush:
    name: "Hostile Mob Cull"
    description: "Cull common hostile mobs without touching passives."
    actions:
      - type: CLEAR_MOBS
        mobs: [ZOMBIE, SKELETON, CREEPER, SPIDER, CAVE_SPIDER, WITHER_SKELETON, PHANTOM, ENDERMAN]
        ignore_named: true
        worlds: [all]

  enderman-reset:
    name: "Enderman Cleanup"
    description: "Remove endermen that are moving blocks or clogging farms."
    actions:
      - type: CLEAR_MOBS
        mobs: [ENDERMAN]
        ignore_named: true
        worlds: [all]

  raid-cleanup:
    name: "Raid Patrol Cleanup"
    description: "Sweeps raid mobs while sparing villagers and pets."
    actions:
      - type: CLEAR_MOBS
        mobs: [PILLAGER, VINDICATOR, EVOKER, RAVAGER]
        ignore_named: true
        worlds: [all]

  ocean-calm:
    name: "Ocean Life Trim"
    description: "Clears excess aquatic mobs to ease waterlag."
    actions:
      - type: CLEAR_MOBS
        mobs: [COD, SALMON, TROPICAL_FISH, DOLPHIN, SQUID, GLOW_SQUID]
        ignore_named: true
        worlds: [all]

  transport-reset:
    name: "Stuck Transport Reset"
    description: "Removes abandoned boats and minecarts."
    actions:
      - type: CLEAR_BOATS
        worlds: [all]
      - type: CLEAR_MINECARTS
        worlds: [all]

  clear-lag:
    name: "Item Sweep"
    description: "Quickly clears dropped items and stray projectiles."
    actions:
      - type: CLEAR_DROPS
        worlds: [all]
      - type: CLEAR_PROJECTILES
        worlds: [all]

  farm-friendly:
    name: "Passive Farm Sweep"
    description: "Removes passive overflow but keeps villagers and named mobs."
    actions:
      - type: CLEAR_MOBS
        mobs: [COW, SHEEP, CHICKEN, PIG, RABBIT]
        ignore_named: true
        worlds: [all]

  nether-chill:
    name: "Nether Hostile Chill"
    description: "Targeted clear of common nether hostiles."
    actions:
      - type: CLEAR_MOBS
        mobs: [ZOMBIFIED_PIGLIN, MAGMA_CUBE, GHAST, BLAZE, WITHER_SKELETON]
        ignore_named: true
        worlds: [world_nether]

  phantom-silence:
    name: "Phantom Silence"
    description: "Removes phantoms hovering above players."
    actions:
      - type: CLEAR_MOBS
        mobs: [PHANTOM]
        ignore_named: true
        worlds: [all]

  slime-drain:
    name: "Slime Chunk Drain"
    description: "Clears slimes and magma cubes clogging slime farms."
    actions:
      - type: CLEAR_MOBS
        mobs: [SLIME, MAGMA_CUBE]
        ignore_named: true
        worlds: [all]

  villager-guard:
    name: "Village Guard Sweep"
    description: "Clears undead and pillager threats without harming villagers."
    actions:
      - type: CLEAR_MOBS
        mobs: [ZOMBIE, HUSK, DROWNED, PILLAGER]
        ignore_named: true
        worlds: [all]

  redstone-friendly:
    name: "Redstone Friendly Cleanup"
    description: "Clears drops, XP, and projectiles without touching mobs."
    actions:
      - type: CLEAR_DROPS
        worlds: [all]
      - type: CLEAR_PROJECTILES
        worlds: [all]
      - type: CLEAR_XP_ORBS
        worlds: [all]

  grinder-reset:
    name: "Mob Grinder Flush"
    description: "Wipes hostile mobs, arrows, and XP around spawner grinders."
    actions:
      - type: CLEAR_MOBS
        mobs: [ZOMBIE, SKELETON, CREEPER, SPIDER, CAVE_SPIDER]
        ignore_named: true
        worlds: [all]
      - type: CLEAR_PROJECTILES
        worlds: [all]
      - type: CLEAR_XP_ORBS
        worlds: [all]
