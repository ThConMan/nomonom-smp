# ###############################################################################
# # PerformanceSuite – Language Pack
# #
# # Keep messages organized just like config.yml so updates stay tidy.
# # Grouped by feature with clear dividers for quick skimming and editing.
# ###############################################################################

messages:
  prefix: §7
  
  # ---------------------------------------------------------------------------
  # Dashboard + snapshots
  # ---------------------------------------------------------------------------
  dashboard:
    refreshed: '%prefix%§aDashboard refreshed.'
  
  snapshots:
    opened: '%prefix%§aOpened snapshot context in chat.'
    header: §bSnapshot » §f%timestamp%
    reason: '§7Reason: §f%reason%'
    metrics: §7MSPT §f%mspt% §8| TPS §f%tps% §8| CPU §f%cpu%
    chunk: §b%chunk% §8| Entities §f%entities% §8(§c%hostile% hostile§8)
    chunk-players: '§7 » Players nearby: §f%players%'
    captured-age: §8Captured %age%s ago.
  
  lag-fix:
    radius: '%prefix%§aClear radius set to §f%radius%'
    refreshed: '%prefix%§eRefreshed lag preset list.'
    executed: '%prefix%§aExecuted preset §f%preset% §7(§fradius %radius%§7).'
  
  schedule:
    triggered: '%prefix%§aTriggered scheduled task §e%task%'
    countdown:
      seconds: 10
      tick: '%prefix%§dRunning §e%preset% §din §e%seconds%s.'
      execute: '%prefix%§dExecuting §e%preset%§d.'
  
  world:
    refresh: '%prefix%§aWorld overview refreshed.'
    sorting: '%prefix%§bSorting by %mode%.'
  
  chunks:
    world-missing: '%prefix%§cWorld is no longer loaded.'
    teleport: '%prefix%§aTeleported to chunk §f%x%§7, §f%z%§7 in §f%world%§7.'
    refreshed: '%prefix%§aChunk metrics refreshed.'
    none: '%prefix%§cNo loaded worlds to inspect.'
  
  impact:
    refreshed: '%prefix%§eRe-loaded plugin impact data.'
  
  chunk-actions:
    unloaded: '%prefix%§cChunk is no longer loaded.'
    removed: '%prefix%§aChunk %chunk% removed §f%removed% §aentities.'
  
  diagnostics:
    completed: '%prefix%§aDiagnostics scan completed.'
    sent: '%prefix%§dDiagnostics sent to Discord.'
  
  command:
    open-in-game: '%prefix%§7Open this in-game to view the dashboard.'
    no-permission: '%prefix%§cNo permission.'
    license-invalid: '%prefix%§cLicense validation failed. Disabling PerformanceSuite.'
    reloaded: '%prefix%§aConfiguration reloaded.'
    scan:
      header: '%prefix%§6Diagnostics found %count% issue(s):'
      item: §7- %issue%
    fix:
      usage: '%prefix%§7Usage: /psuite fix <preset>'
      not-found: '%prefix%§cPreset not found.'
      executed: '%prefix%§aExecuted preset §f%preset%§a, removed %removed% entities.'
    redstone:
      usage: '%prefix%§eUsage: /psuite redstone <add|remove>'
  
  updates:
    checking: '%prefix%§eAlready checking for updates.'
    failed: '%prefix%§cFailed to check for updates. See console for details.'
    no-metadata: '%prefix%§cUpdate metadata unavailable. Check configuration or network
      connectivity.'
    latest: '%prefix%§aYou are running the latest version (%version%)'
    downloading: '%prefix%§eAn update is already downloading. Please wait.'
    available: '%prefix%§bUpdate ready §7» §fPerformanceSuite v%version% §7(§eClick
      to download§7)'
    available-hover: §7Download PerformanceSuite v%version% now.
    download-success: '%prefix%§aDownloaded PerformanceSuite v%version% (§f%file%§a).
      Restart your server to apply the update.'
    download-failed: '%prefix%§c%reason%'
    download-failed-console: '%prefix%§c%reason%'

