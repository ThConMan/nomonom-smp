License: "2NFG-SH1J-TJCZ"

# Enable debug mode to log detailed information about location finding
# This can help diagnose teleportation issues
debug: false

settings:
  zone-method: "single" # or multi-world

# List of WorldGuard regions where the RTP functionality will be active
# You can add multiple regions by adding new lines with a dash (-)
regions:
  - rtpzone

# Random Teleport (RTP) settings
rtp:
  # Teleportation mode: "GROUP" or "INDIVIDUAL"
  # GROUP: Players will teleport close to each other (original behavior)
  # INDIVIDUAL: Each player gets their own random location
  mode: "GROUP"

  # The world where players will be teleported (used for single world mode)
  world: mortal_realm
  # The minimum and maximum X coordinates for teleportation
  MinX: -3000
  MaxX: 3000
  # The minimum and maximum Z coordinates for teleportation
  MinZ: -3000
  MaxZ: 3000
  # List of block types that players should not be teleported onto
  blacklist:
    - LAVA
    - WATER
    - POWDER_SNOW
    - CACTUS
    - MAGMA_BLOCK
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - FIRE
    - SOUL_FIRE
  # List of biomes that players should not be teleported into
  biomes:
    - OCEAN
    - LUKEWARM_OCEAN
    - DEEP_OCEAN
    - DEEP_LUKEWARM_OCEAN
    - DEEP_WARM_OCEAN
    - WARM_OCEAN
    - COLD_OCEAN
    - FROZEN_OCEAN
    - DEEP_COLD_OCEAN
    - RIVER
    - FROZEN_RIVER
    - DEEP_FROZEN_OCEAN
    - BEACH
    - SNOWY_BEACH
    - STONY_SHORE

# Multi-world configuration (used when zone-method is "multi-world")
worlds:
  mortal_realm:
    name: "mortal_realm"
    display_name: "Overworld"
    min_x: -1000
    max_x: 1000
    min_z: -1000
    max_z: 1000

  end:
    name: "world_the_end"
    display_name: "The End"
    min_x: -800
    max_x: 800
    min_z: -800
    max_z: 800

# Teleportation queue settings for high player counts
teleport:
  # Number of players to teleport in each batch
  batch_size: 5
  # Delay in ticks between processing batches (20 ticks = 1 second)
  processing_delay: 5

# The prefix that will be shown in messages and titles
# You can use hex color codes (&#RRGGBB) and regular color codes (&a, &b, etc.)
prefix: "&#d00000ʀᴛᴘ ᴢoɴᴇ"

# The countdown time in seconds before players are teleported
timer: 8

display:
  # Enable/disable action bar countdown
  actionbar:
    enabled: true
    message: "&#FF0000&lRTPZONE &7➟ &fTeleporting in &#FF0000%donutrtp_zone% &fseconds!"

  # Enable/disable chat countdown
  chat:
    enabled: false
    message: "&#FF0000&lRTPZONE &7➟ &fTeleporting in &#FF0000%donutrtp_zone% &fseconds!"

# Customizable messages shown to players
subtitles:
  # Message shown during the countdown, %donutrtp_zone% will be replaced with the time left
  timer: "&fTeleporting in %donutrtp_zone%"
  # Message shown after teleportation
  teleported: "&fFight players and steal their loot"
  # Message shown when player is in queue
  queue: "&#C7C7C7Your position of the queue is &#086AFB#%position_number%"

# Sound effects for different events
sounds:
  # Sound played when a player enters the RTP region
  enter_region:
    sound: "BLOCK_BEACON_POWER_SELECT"
    pitch: 0.5
  # Sound played during the countdown
  countdown:
    sound: "BLOCK_BEACON_AMBIENT"
    pitch: 0.5
  # Sound played when a player exits the RTP region
  exit_region:
    sound: "BLOCK_BEACON_DEACTIVATE"
    pitch: 0.5
  # Sound played when a player is teleported
  teleported:
    sound: "BLOCK_END_GATEWAY_SPAWN"
    pitch: 0.5