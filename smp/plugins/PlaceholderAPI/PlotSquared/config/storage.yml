prefix: ''

# SQLite section
sqlite:
  # Should SQLite be used?
  use: true
  # The file to use
  db: "storage"

# MySQL section
mysql:
  # Should MySQL be used?
  use: false
  host: "localhost"
  port: "3306"
  user: "REPLACE_ME_DB_USER"
  password: "REPLACE_ME_DB_PASSWORD"
  database: "plot_db"
  # Set additional properties: https://dev.mysql.com/doc/connector-j/en/connector-j-reference-configuration-properties.html
  properties: 
  - "useSSL=false"
