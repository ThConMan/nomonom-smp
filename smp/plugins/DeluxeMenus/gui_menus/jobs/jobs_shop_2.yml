menu_title: 'Jobs | Points Shop'
size: 54
items:
  information:
    material: SUNFLOWER
    slot: 4
    display_name: "%imc_primary-color_c%Information"
    item_flags: [HIDE_ATTRIBUTES]
    lore:
      - "%imc_dark-color_c%Earn %imc_job-point-format_c_Points %%imc_dark-color_c% by performing paid"
      - "%imc_dark-color_c%actions for your job or by leveling up."
      - ''
      - '%imc_text-color_c%Points: %imc_job-point-format_c_{jobsr_user_points_fixed}%'
      - ''
      - "%imc_darkest-color_c%What is this money used for?"
      - "%imc_job-point-format_c_Points %%imc_dark-color_c% allow you to purchase"
      - "%imc_dark-color_c%various items in this shop."
      - ''
      - '%imc_darkest-color_c%Statistics:'
      - "%imc_dark-color_c% • %imc_text-color_c%Points collected all-time: %imc_job-point-format_c_{jobsr_user_total_points}%"

################## SHOP ITEMS

##################################
#            IRON INGOT          #
##################################

  iron_ingot_lock:
    material: IRON_INGOT
    slot: 19
    amount: 48
    priority: 0
    display_name: "%imc_dark-color_c%x48 %imc_primary-color_c%Iron Ingot"
    item_flags: [HIDE_ATTRIBUTES]
    lore:
      - '%imc_dark-color_c%Buy items using your points'
      - ''
      - '%imc_text-color_c%Price: %imc_job-point-format_c_500 Points %'
      - ''
      - "&c✘ You don't have enough Points."
    view_requirement:
      requirements:
        balance:
          type: '<'
          input: '%jobsr_user_points_fixed%'
          output: 500
    click_commands:
      - "[message] $<p:error-prefix> You don't have enough <p:job-point-format:'Points'>."

  iron_ingot_available:
    material: IRON_INGOT
    slot: 19
    amount: 48
    priority: 1
    display_name: "%imc_dark-color_c%x48 %imc_primary-color_c%Iron Ingot"
    item_flags: [HIDE_ATTRIBUTES]
    lore:
      - '%imc_dark-color_c%Buy items using your points'
      - ''
      - '%imc_text-color_c%Price: %imc_job-point-format_c_500 Points %'
      - ''
      - "%imc_dark-color_c%◆ %imc_primary-color_c%Click:%imc_text-color_c% Purchase"
    click_requirement:
      requirements:
        balance:
          type: '>='
          input: '%jobsr_user_points_fixed%'
          output: 500
      deny_commands:
        - "[message] $<p:error-prefix> You don't have enough <p:job-point-format:'Points'>."
    click_commands:
      - '[console] jobs editpoints take %player_name% 500'
      - '[sound] BLOCK_DECORATED_POT_INSERT'
      - '[console] minecraft:give %player_name% iron_ingot 48'
      - "[message] $<p:prefix> You have succesfully bought <p:dark-color>x48</p> <p:primary-color>Iron Ingot"
      - '[refresh]'

