menu_title: Jobs Payouts | Explorer
open_command:
  - jobs payouts explorer
register_command: true
size: 54
items:
  explore:
    material: LEATHER_BOOTS
    slot: 3
    display_name: '%imc_primary-color_c%Explore'
    enchantment_glint_override: true
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    lore:
      - '%imc_dark-color_c%Discover chunks to'
      - '%imc_dark-color_c%receive your payment.'
    click_commands:
      - '[openguimenu] jobs_payouts_explorer_explore'
  trade:
    material: EMERALD
    slot: 5
    display_name: '%imc_primary-color_c%Villager Trade'
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    lore:
      - '%imc_dark-color_c%Trade with villagers the following'
      - '%imc_dark-color_c%items to receive your payment.'
    click_commands:
      - '[openguimenu] jobs_payouts_explorer_trade'
  explore_leather_boots:
    material: leather_boots
    slot: 10
    display_name: '%imc_primary-color_c%Discover a Chunk'
    item_flags:
      - HIDE_ATTRIBUTES
    lore:
      - '%imc_darkest-color_c%Discovery:'
      - '%imc_dark-color_c% • %imc_text-color_c%First Discovery'
      - '%imc_dark-color_c% • %imc_text-color_c%Second Discovery'
      - '%imc_dark-color_c% • %imc_text-color_c%Third Discovery'
      - '%imc_dark-color_c% • %imc_text-color_c%Fourth Discovery'
      - '%imc_dark-color_c% • %imc_text-color_c%Fifth Discovery'
  back:
    material: REDSTONE
    slot: 49
    display_name: '%imc_dark-color_c%Back'
    click_commands:
      - '[openguimenu] jobs_skilltree_explorer_1'
      - '[sound] UI_BUTTON_CLICK'
  background:
    material: CYAN_STAINED_GLASS_PANE
    display_name: '&l'
    slots:
      - 0
      - 1
      - 7
      - 8
      - 45
      - 46
      - 52
      - 53
