##################################
#                                #
#          WOODCUTTER            #    
#                                #
##################################
  woodcutter_joined:
    material: GOLDEN_AXE
    slot: 20
    priority: 1
    dynamic_amount: "%jobsr_user_jlevel_woodcutter%"
    view_requirement:
      requirements:
        joined:
          type: string contains
          input: "%jobsr_user_isin_woodcutter%"
          output: "True"
    enchantment_glint_override: true
    item_flags: [HIDE_ENCHANTS, HIDE_ATTRIBUTES]
    display_name: "&aWoodcutter %imc_f_latin_{jobsr_user_jlevel_woodcutter}%"
    lore:
      - '%imc_darkest-color_c%Status: &aWorking'
      - '%imc_darkest-color_c%Employees: %imc_secondary-color_c%%jobsr_totalplayers_woodcutter%'
      - ''
      - '%imc_dark-color_c%Chop trees and harvest wood'
      - '%imc_dark-color_c%efficiently.'
      - ''
      - '%imc_darkest-color_c%Paid Actions:'
      - "%imc_dark-color_c% • %imc_text-color_c%Break"
      - ''
      - "%imc_dark-color_c%◆ %imc_primary-color_c%Click:%imc_text-color_c% More information"
      - "%imc_dark-color_c%◆ %imc_primary-color_c%Shift Click:%imc_text-color_c% Leave"
    shift_right_click_commands:
      - '[player] jobs leave woodcutter'
      - '[sound] BLOCK_COMPOSTER_FILL'
      - '[refresh]'
    shift_left_click_commands:
      - '[player] jobs leave woodcutter'
      - '[sound] BLOCK_COMPOSTER_FILL'
      - '[refresh]'
    right_click_commands:
      - '[openguimenu] jobs_skilltree_woodcutter_1'
      - '[sound] UI_BUTTON_CLICK'
    left_click_commands:
      - '[openguimenu] jobs_skilltree_woodcutter_1'
      - '[sound] UI_BUTTON_CLICK'

  woodcutter_maxjobs:
    material: GOLDEN_AXE
    slot: 20
    priority: 2
    view_requirement:
      requirements:
        maxjobs:
          type: "=="
          input: "%jobsr_user_joinedjobcount%"
          output: "%jobsr_maxjobs%"
    item_flags: [HIDE_ENCHANTS, HIDE_ATTRIBUTES]
    display_name: "&aWoodcutter"
    lore:
      - '%imc_darkest-color_c%Status: &eNot Employed'
      - '%imc_darkest-color_c%Employees: %imc_secondary-color_c%%jobsr_totalplayers_woodcutter%'
      - ''
      - '%imc_dark-color_c%Chop trees and harvest wood'
      - '%imc_dark-color_c%efficiently.'
      - ''
      - '%imc_darkest-color_c%Paid Actions:'
      - "%imc_dark-color_c% • %imc_text-color_c%Break"
      - ''
      - '&c✘ You can only have %jobsr_maxjobs% jobs.'
      - ''
      - "%imc_dark-color_c%◆ %imc_primary-color_c%Click:%imc_text-color_c% More information"
    right_click_commands:
      - '[openguimenu] jobs_skilltree_woodcutter_1'
      - '[sound] UI_BUTTON_CLICK'
    left_click_commands:
      - '[openguimenu] jobs_skilltree_woodcutter_1'
      - '[sound] UI_BUTTON_CLICK'

  woodcutter:
    material: GOLDEN_AXE
    slot: 20
    priority: 3
    display_name: "&aWoodcutter"
    item_flags: [HIDE_ATTRIBUTES]
