menu_title: Jobs | Miner
size: 54
items:
  payouts:
    material: RAW_GOLD
    slot: 5
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    display_name: '&ePaid actions'
    lore:
      - '%imc_dark-color_c%Find all the actions you can'
