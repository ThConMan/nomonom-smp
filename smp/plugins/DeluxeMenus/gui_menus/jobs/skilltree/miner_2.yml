    slot: 4
    priority: 1
    dynamic_amount: '%jobsr_user_jlevel_miner%'
    view_requirement:
      requirements:
        joined:
          type: string contains
          input: '%jobsr_user_isin_miner%'
          output: 'True'
    enchantment_glint_override: true
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    display_name: '&bMiner %imc_f_latin_{jobsr_user_jlevel_miner}%'
    lore:
      - '%imc_darkest-color_c%Status: &aWorking'
      - '%imc_darkest-color_c%Employees: %imc_secondary-color_c%%jobsr_totalplayers_miner%'
      - ''
      - '%imc_dark-color_c%Dig through the depths to'
      - '%imc_dark-color_c%uncover valuable resources.'
      - ''
      - '%imc_darkest-color_c%Statistics:'
      - '%imc_dark-color_c% • %imc_text-color_c%Level: %imc_primary-color_c%%jobsr_user_jlevel_miner%%imc_dark-color_c%/%jobsr_user_jmaxlvl_miner%'
