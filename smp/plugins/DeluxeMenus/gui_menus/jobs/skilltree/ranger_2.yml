menu_title: Jobs | Ranger
size: 54
items:
  payouts:
    material: RAW_GOLD
    slot: 5
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    display_name: '&ePaid actions'
    lore:
      - '%imc_dark-color_c%Find all the actions you can'
      - '%imc_dark-color_c%perform to get paid through'
      - '%imc_dark-color_c%this job.'
      - ''
      - '%imc_darkest-color_c%Paid Actions:'
      - '%imc_dark-color_c% • %imc_text-color_c%Kill'
      - '%imc_dark-color_c% • %imc_text-color_c%Fish'
      - '%imc_dark-color_c% • %imc_text-color_c%Breed'
