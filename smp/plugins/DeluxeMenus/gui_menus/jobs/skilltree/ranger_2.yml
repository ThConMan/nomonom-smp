      - ''
      - '%imc_dark-color_c%◆ %imc_primary-color_c%Click:%imc_text-color_c% Get payouts information'
    click_commands:
      - '[openguimenu] jobs_payouts_ranger_kill'
      - '[sound] UI_BUTTON_CLICK'
  information_joined:
    material: LEAD
    slot: 4
    priority: 1
    dynamic_amount: '%jobsr_user_jlevel_ranger%'
    view_requirement:
      requirements:
        joined:
          type: string contains
          input: '%jobsr_user_isin_ranger%'
          output: 'True'
    enchantment_glint_override: true
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    display_name: '&cRanger %imc_f_latin_{jobsr_user_jlevel_ranger}%'
    lore:
      - '%imc_darkest-color_c%Status: &aWorking'
      - '%imc_darkest-color_c%Employees: %imc_secondary-color_c%%jobsr_totalplayers_ranger%'
      - ''
      - '%imc_dark-color_c%Protect, breed, fish,'
      - '%imc_dark-color_c%and hunt animals.'
      - ''
      - '%imc_darkest-color_c%Statistics:'
      - '%imc_dark-color_c% • %imc_text-color_c%Level: %imc_primary-color_c%%jobsr_user_jlevel_ranger%%imc_dark-color_c%/%jobsr_user_jmaxlvl_ranger%'
      - '%imc_dark-color_c% • %imc_text-color_c%Progress:%imc_job-exp-format_c_ %%jobsr_user_jexp_rounded_ranger%%imc_dark-color_c%/%jobsr_user_jmaxexp_ranger%'
