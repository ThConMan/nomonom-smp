menu_title: Jobs | Farmer
open_command:
  - jobs skilltree farmer
  - jobs farmer
register_command: true
size: 54
items:
  payouts:
    material: RAW_GOLD
    slot: 5
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    display_name: '&ePaid actions'
    lore:
      - '%imc_dark-color_c%Find all the actions you can'
      - '%imc_dark-color_c%perform to get paid through'
      - '%imc_dark-color_c%this job.'
      - ''
      - '%imc_darkest-color_c%Paid Actions:'
      - '%imc_dark-color_c% • %imc_text-color_c%Break'
      - '%imc_dark-color_c% • %imc_text-color_c%Place'
      - ''
      - '%imc_dark-color_c%◆ %imc_primary-color_c%Click:%imc_text-color_c% Get payouts information'
    click_commands:
      - '[openguimenu] jobs_payouts_farmer_break'
      - '[sound] UI_BUTTON_CLICK'
  information_joined:
    material: WHEAT
    slot: 4
    priority: 1
    dynamic_amount: '%jobsr_user_jlevel_farmer%'
    view_requirement:
      requirements:
        joined:
          type: string contains
          input: '%jobsr_user_isin_farmer%'
          output: 'True'
    enchantment_glint_override: true
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    display_name: '&eFarmer %imc_f_latin_{jobsr_user_jlevel_farmer}%'
    lore:
      - '%imc_darkest-color_c%Status: &aWorking'
      - '%imc_darkest-color_c%Employees: %imc_secondary-color_c%%jobsr_totalplayers_farmer%'
      - ''
      - '%imc_dark-color_c%Work the fields to produce'
      - '%imc_dark-color_c%food and resources.'
      - ''
      - '%imc_darkest-color_c%Statistics:'
      - '%imc_dark-color_c% • %imc_text-color_c%Level: %imc_primary-color_c%%jobsr_user_jlevel_farmer%%imc_dark-color_c%/%jobsr_user_jmaxlvl_farmer%'
      - '%imc_dark-color_c% • %imc_text-color_c%Progress:%imc_job-exp-format_c_ %%jobsr_user_jexp_rounded_farmer%%imc_dark-color_c%/%jobsr_user_jmaxexp_farmer%'
      - ' %imc_job-progress_{jobsr_user_jexpunf_farmer}_{jobsr_user_jmaxexpunf_farmer}%'
      - ''
      - '%imc_dark-color_c%◆ %imc_primary-color_c%Click:%imc_text-color_c% Leave'
    click_commands:
      - '[player] jobs leave farmer'
      - '[sound] BLOCK_COMPOSTER_FILL'
      - '[refresh]'
