# plugins/MMOItems/crafting-stations/ascended-forge.yml
name: "Ascended Forge"
max-queue-size: 10

command:
  name: "ascendedforge"
  description: "Open the Ascended Forge"
  usage: "/ascendedforge"
  permission: "mmoitems.ascended_forge"
  aliases: [ "aforge", "mmoitems_aforge" ]
  message:
    no-perm: "&cYou don't have enough permissions."
    not-a-player: "&cThis command is for players only."

recipes:
  # --- ASCENDED INGOT (Bedrock-compatible crafting) ---
  # --- ASCENDED INGOT (Updated) ---
  # --- ASCENDED INGOT (Updated, Corrected) ---
  # --- ASCENDED INGOT (Updated to match new 3x3 recipe) ---
  # --- ASCENDED INGOT (Updated to match new 3x3 recipe) ---
  ascend-ingot:
    output: "mmoitem{type=MATERIAL,id=ASCENDED_INGOT}"
    crafting-time: 0
    slot: 13
    lore:
      - "&6&lASCENDED INGOT"
      - "&c&lBedrock-Compatible: Craft it here."
      - "&6&lCosts:&7 4 Netherite Ingots, 2 Ascended Shards, 2 Echo Shards, 1 Nether Star"
    ingredients:
      # Row 1: Netherite, Ascended Shard, Netherite
      - "vanilla{type=NETHERITE_INGOT,amount=1,display=\"Netherite Ingot\"}"
      - "mmoitem{type=MATERIAL,id=ASCENDED_SHARDS,amount=1,display=\"Ascended Shard\"}"
      - "vanilla{type=NETHERITE_INGOT,amount=1,display=\"Netherite Ingot\"}"

      # Row 2: Echo, Nether Star, Echo
      - "vanilla{type=ECHO_SHARD,amount=1,display=\"Echo Shard\"}"
      - "vanilla{type=NETHER_STAR,amount=1,display=\"Nether Star\"}"
      - "vanilla{type=ECHO_SHARD,amount=1,display=\"Echo Shard\"}"

      # Row 3: Netherite, Ascended Shard, Netherite
      - "vanilla{type=NETHERITE_INGOT,amount=1,display=\"Netherite Ingot\"}"
      - "mmoitem{type=MATERIAL,id=ASCENDED_SHARDS,amount=1,display=\"Ascended Shard\"}"
      - "vanilla{type=NETHERITE_INGOT,amount=1,display=\"Netherite Ingot\"}"

  # --- TOOLS / WEAPONS (TOP ROW) ---

  ascend-pickaxe:
    output: "mmoitem{type=TOOL,id=ASCENDED_PICKAXE}"
    crafting-time: 0
    lore:
      - "&c&l⚠ WARNING"
      - "&6The Netherite item you use will be"
      - "&creset &6to &f&lno enchants, no name, no lore&6."
      - "&6Make sure you're okay losing upgrades!"
    ingredients:
      - "vanilla{type=NETHERITE_PICKAXE,amount=1,display=\"Netherite Pickaxe\"}"
      - "mmoitem{type=MATERIAL,id=ASCENDED_INGOT,amount=1,display=\"Ascended Ingot\"}"

  ascend-axe:
