ASCENDED_INGOT:
  base:
    material: NETHERITE_INGOT
    name: '&dAscended Ingot'
    lore:
    - '&7Forged with echo and amethyst resonance.'
    - '&8Used to craft Ascended gear.'
    disable-smelting: true
    hide-enchants: true
    enchants:
      unbreaking: 1
    crafting:
      shapeless: {}
      shaped:
        '1':
          input:
          - m material ascended_shards 1.0..|v netherite_ingot - 1.0..|m material
            ascended_shards 1.0..
          - v echo_shard - 1.0..|v nether_star - 1.0..|v echo_shard - 1.0..
          - m material ascended_shards 1.0..|v netherite_ingot - 1.0..|m material
            ascended_shards 1.0..
    disable-crafting: true
