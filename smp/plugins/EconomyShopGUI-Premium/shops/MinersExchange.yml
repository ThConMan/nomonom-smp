      # =========================================================
      # QoL Packs (NOT game-breaking, no enchants, no AE overlap)
      # These are command packs: items go straight to inventory.
      # =========================================================

      '1':
        material: BUNDLE
        displayname: "&6&lMiner's Satchel"
        lore:
          - "&7Basic supplies for a real mining run."
          - ""
          - "&fYou get:"
          - "&f• &e64x &fTorch"
          - "&f• &e16x &fLadder"
          - "&f• &e8x &fCooked Beef"
          - "&f• &e1x &fWater Bucket"
          - ""
          - "&8No resale"
        buy: 260
        sell: -1
        giveItem: false
        buy-commands:
          - "cmi give %player% torch 64"
          - "cmi give %player% ladder 16"
          - "cmi give %player% cooked_beef 8"
          - "cmi give %player% water_bucket 1"

      '2':
        material: BUNDLE
        displayname: "&e&lDeep Delver Pack"
        lore:
          - "&7For longer trips (and bad decisions)."
          - ""
          - "&fYou get:"
          - "&f• &e128x &fTorch"
          - "&f• &e32x &fLadder"
          - "&f• &e16x &fCooked Beef"
          - "&f• &e1x &fWater Bucket"
          - "&f• &e1x &fMilk Bucket"
          - ""
          - "&8No resale"
        buy: 540
        sell: -1
        giveItem: false
        buy-commands:
          - "cmi give %player% torch 128"
          - "cmi give %player% ladder 32"
          - "cmi give %player% cooked_beef 16"
          - "cmi give %player% water_bucket 1"
          - "cmi give %player% milk_bucket 1"

      '3':
        material: BUNDLE
