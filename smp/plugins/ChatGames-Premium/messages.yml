    - ''
    - '$  <p:text-color> • <p:primary-color>%selection%'
    - ''
  correct_message: 
    - ''
    - '$  <p:prefix> Unscramble'
    - '$  <p:text-color><p:primary-color>%winner_1%</p> has correctly unscrambled <p:primary-color>%correct_answer%</p><p:dark-color>(%time_1%s)</p>'
    - ''
  time_expired_message:
    - '$<p:prefix> The Unscramble game is now over!'
