unknown_command: '$<p:error-prefix> Unknown command.'
config_reloaded: '$<p:prefix> The configuration files has been reloaded!'
not_enough_permissions: '$<p:error-prefix> You don`t have enough permissions to execute this command!'
player_only_command: '&cThis command can only be executed by players!'
player_deleted: '$<p:prefix> The player <p:primary-color>%player%</p> has been removed from the database!'
player_not_found: '$<p:error-prefix> Unable to find the player <p:primary-color><quote>%player%</quote></p>'
number_not_found_commands: '$<p:error-prefix> Unable to find number to apply to command'
points_added: '$<p:prefix> Added <p:primary-color>%amount%</p> points to <p:primary-color>%player%</p>'
points_removed: '$<p:prefix> Removed <p:primary-color>%amount%</p> points from <p:primary-color>%player%</p>'
points_set: '$<p:prefix> Set <p:primary-color>%player%</p>`s points to <p:primary-color>%amount%</p>'
player_points: '$<p:prefix> You have <p:primary-color>%amount%</p> points!'
in_cooldown: '$<p:error-prefix> You can`t use this yet, wait <p:primary-color>%time_left%</p> before using the command again'
type_not_found: '$<p:error-prefix> Unable to find the type of material/entity for <p:primary-color><quote>%type%</quote></p>'
inventory_full: '$<p:error-prefix> Your inventory is full! Reward dropped at your location'

no_winner_placeholder: '---'
cannot_start_from_disabled: '$<p:error-prefix> You can`t start a chat game from a disabled world!'
toggle_game: '$<p:prefix> You have toggled %state% chat events!'
toggle_sound: '$<p:prefix> You have toggled %state% chat game sounds!'
toggleAllGames: '$<p:prefix> You have toggled %state% all chatgames!'
state-ON: '<green>ON</green>'
state-OFF: '<red>OFF</red>'
game_started: '$<p:prefix> You have started a %game% chat event in your chat!'
invalid_arguments: '$<p:error-prefix> There was a problem while trying to validate the arguments for the command!'
cant_log_local: '$<p:error-prefix> You can`t see log messages because this option is disabled in the config!'

logs:
  no_logs: "&cNo logs available or an error occurred."
  header: "$<p:prefix> Last %amount% logs:"
  entries:
    # Game-related log entries
    game:
      start: "&aGame Starting: &f%game% | &aHas Answer: &f%hasAnswer% | &aAnswer: &f%answer%"
      end: "&aGame Ending: &f%game% | &aHas Winner: &f%hasWinner% | &aWinners: &f%winners% | &aAnswer: &f%answer%"

    # Race-related log entries for Material-type races
    race:
      start: "&aRace Starting: &f%race% | &aMaterial: &f%material% | &aAmount: &f%amount%"
      end: "&aRace Ending: &f%race% | &aHas Winner: &f%hasWinner% | &aWinner: &f%winner% | &aMaterial: &f%material% | &aAmount: &f%amount%"

    # Special entry for HUNT race (Entity-type race)
    hunt:
      start: "&aRace Starting: &f%race% | &aEntity: &f%entity% | &aAmount: &f%amount%"
      end: "&aRace Ending: &f%race% | &aHas Winner: &f%hasWinner% | &aWinner: &f%winner% | &aEntity: &f%entity% | &aAmount: &f%amount%"

#You can use <center> if you wish to do so in the top messages.
top:
  #You can leave empty if you want to disable a certain message out of all. (Excluding 'format' and 'player-stat-format')
  header: '$<br><p:prefix> Top Chat'
  #The separators value is that one message that is sent to space out the top 10 players from header and footer!
  separators: ''
  format: '$<p:primary-color>#<b>%spot%</b></p> %player% <p:dark-color>-</p> <p:primary-color>%points% wins</p>'
  player-stat-format: '$<p:text-color> • You`ve got <p:primary-color>%player_points% wins</p>'
  total-stat-format: '$<p:text-color> • Total games won globally: <p:primary-color>%total_wins%</p>'
  footer: ''
  
  no_data_message: '$<p:text-color> • There is no data yet! Win a chat game and get points!'
  
TypersTop:
  #You can leave empty if you want to disable a certain message out of all. (Excluding 'format' and 'player-stat-format')
  header: '$<br><p:prefix> Top Fastet'
  separators: ''
  format: '$<p:text-color><p:primary-color>#<b>%spot%</b></p> %player% <p:dark-color>-</p> <p:primary-color>%time%s</p>'
  player-stat-format: '$<p:text-color> • Your fastest time is <p:primary-color>%fastest_time%s</p>'
  footer: ''
  
  no_data_message: '$<p:text-color> • There is no data yet! Win a chat game and be the fastest!'
  top_disabled_message: '$<p:error-prefix> This function is currently disabled!'

help_command:
  - ''
  - '$<p:prefix> ChatGames'
  - ''
  - '$<p:text-color> • <p:primary-color>/chatgames <type></p> <p:dark-color>-</p> Starts the event type specified instantly.'
  - '$<p:text-color> • <p:primary-color>/chatgames top</p> <p:dark-color>-</p> Shows the top 10 players with most points.'
  - '$<p:text-color> • <p:primary-color>/chatgames fastest</p> <p:dark-color>-</p> Shows the top 10 players with fastest times.'
  - '$<p:text-color> • <p:primary-color>/chatgames toggle</p> <p:dark-color>-</p> Toggle games on or off.'
  - '$<p:text-color> • <p:primary-color>/chatgames togglesound</p> <p:dark-color>-</p> Toggle chat games SOUNDS on or off.'
  - '$<p:text-color> • <p:primary-color>/chatgames reload</p> <p:dark-color>-</p> Reloads the config.yml file.'
  - '$<p:text-color> • <p:primary-color>/chatgames +points <player> <amount></p> <p:dark-color>-</p> RAdds points to a player.'
  - '$<p:text-color> • <p:primary-color>/chatgames -points <player> <amount></p> <p:dark-color>-</p> Removes points from a player.'
  - '$<p:text-color> • <p:primary-color>/chatgames setpoints <player> <amount></p> <p:dark-color>-</p> Sets the points for a player'
  - '$<p:text-color> • <p:primary-color>/chatgames points</p> <p:dark-color>-</p> Returns your points'
  - '$<p:text-color> • <p:primary-color>/chatgames logs <amount></p> <p:dark-color>-</p> Returns the last X amount of game logs.'
  - ''
  - '$<p:text-color>Types: <p:primary-color>Unscramble</p>, <p:primary-color>Unreverse</p>, <p:primary-color>Reaction</p>, <p:primary-color>Random</p>, <p:primary-color>Fillout</p>, <p:primary-color>Variable</p>, <p:primary-color>Clickable</p>, <p:primary-color>Math</p>, <p:primary-color>Trivia</p>, <p:primary-color>Hoverable</p>, <p:primary-color>Hunt</p>, <p:primary-color>Mine</p>, <p:primary-color>Place</p>, <p:primary-color>Fish</p>, <p:primary-color>Craft</p>, <p:primary-color>Eat</p>, <p:primary-color>Furnace</p>'
  - ''
  
