waiting_for_other_winners: '$<p:prefix> <p:primary-color>You got it right!</p> Waiting for other winners...'
wrong_case: '$<p:prefix> Almost... Check your capitalization!'
#YOU CAN USE "%display_name%" AS A REPLACEMENT FOR %player% IN correct_message FOR ALL GAMES.
