# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/conditional-text
conditional-text:
  actionbar:
    priority_1:
      text: '%np_background_other_actionbar%' # hides the money hud when a player rides something or dives in water
      conditions:
        condition_or:
          type: "||"
          refresh-interval: 1
          value:
            condition_passenger:
              type: is-passenger
              refresh-interval: 1
              value: true
            condition_air:
              type: "!="
              refresh-interval: 1
              value:
                value1: '%player_remaining_air%'
                value2: "300"
            condition_gamemode:
              type: "!gamemode"
              refresh-interval: 1
              value: survival
    priority_2:
      text: '%np_static_money_hud%%np_offset_-179%%np_static_other_actionbar%' # displays the money hud + other plugin's actionbar message
      conditions:
        condition_other_actionbar:
          type: "!equals"
          refresh-interval: 1
          value:
            value1: '%np_actionbar%'
            value2: ""
    priority_3:
      text: '%np_static_money_hud%' # displays the money hud only

  weather:
    priority_1:
      text: '<gradient:#9FF5C7:#5EDFA0><bold>Sunny</bold></gradient>'
      conditions:
        weather:
          - clear
    priority_2:
      text: '<gradient:#6BE7FF:#3A7DFF><bold>Rainy</bold></gradient>'
      conditions:
        weather:
          - rain
    priority_3:
      text: '<gradient:#FF5A5A:#B14CFF><bold>Thunder</bold></gradient>'
      conditions:
        weather:
          - thunder

# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/background-nameplate-bubble-text
bubble-text:
  chat:
    bubble: chat_1
    text: '<black>Nice to meet you!</black>'
    left-margin: 1
    right-margin: 1

# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/background-nameplate-bubble-text
nameplate-text:
  halloween:
    nameplate: halloween
    text: '<gradient:#FFD700:#FFA500:#FFD700>Today is Halloween! Trick or treat!</gradient>'
    left-margin: 1
    right-margin: 1

# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/background-nameplate-bubble-text
background-text:
  location:
    background: bedrock_1
    text: '<shadow:#00000000>%np_image_compass%</shadow> %np_shift_location%'
    shadow: false
    left-margin: 1
    right-margin: 1

  time:
    background: bedrock_1
    text: '<shadow:#00000000>%np_image_clock%</shadow> %np_shift_time%'
    shadow: false
    left-margin: 1
    right-margin: 1

  weather:
    background: bedrock_1
    text: '<shadow:#00000000>%np_image_weather%</shadow> %np_shift_weather%'
    shadow: false
    left-margin: 1
    right-margin: 1

  # NEW: boxed Nomonom title (use %np_background_nomonom% anywhere, incl. bossbar.yml)
  nomonom:
    background: bedrock_1
    text: '%np_shift_nomonom%'
    shadow: false
    left-margin: 1
    right-margin: 1



  # NEW: boxed ping (use %np_background_ping%)
  # NOTE: no icon here to avoid raw %np_image_signal% showing if it doesn't exist
  ping:
    background: bedrock_1
    text: '%np_shift_ping%'
    shadow: false
    left-margin: 1
    right-margin: 1

  # NEW: boxed money (use %np_background_money%)
  money:
    background: bedrock_1
    text: '<shadow:#00000000>%np_image_coin%</shadow> %np_shift_money_pretty%'
    shadow: false
    left-margin: 1
    right-margin: 1



  hello:
    background: bedrock_1
    text: '<shadow:#00000000>%np_image_bubble%</shadow> %np_shift_hello%'
    shadow: false
    left-margin: 1
    right-margin: 1

  update:
    background: bedrock_1
    text: '<shadow:#00000000>%np_image_bell%</shadow> %np_shift_update%'
    shadow: false
    left-margin: 1
    right-margin: 1

  other_actionbar:
    background: bedrock_2
    text: '%np_actionbar%'
    shadow: false
    left-margin: 1
    right-margin: 1

# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/static-text
static-text:
  money_hud:
    position: right
    text: '%np_image_coin% %np_shift_money%'
    value: 180
  other_actionbar:
    position: middle
    text: "%np_background_other_actionbar%"
    value: 180

# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/shift-text
shift-text:
  player_name:
    text: "%player_name%"
    font: shift_0

  # Styled but no coords - shows realm name using your existing switch-text mapping
  location:
    text: "<shadow:#000000:0.6><gray>Realm:</gray> <gradient:#F7D046:#3FE0C5><bold>%np_switch_world%</bold></gradient></shadow>"
    font: shift_1

  time:
    text: "<shadow:#000000:0.6><gray>Time:</gray> <gradient:#6BE7FF:#3A7DFF><bold>%np_time_12%</bold></gradient></shadow>"
    font: shift_1

  weather:
    text: "<shadow:#000000:0.6><gray>Weather:</gray> <gradient:#9FF5C7:#5EDFA0><bold>%np_conditional_weather%</bold></gradient></shadow>"
    font: shift_1

  update:
    text: "<shadow:#000000:0.6><gradient:#FF5A5A:#B14CFF><bold>A newer version is available!</bold></gradient></shadow>"
    font: shift_1

  # NEW: the actual styled title text used inside the Nomonom box
  nomonom:
    text: "<shadow:#000000:0.85><gradient:#FFD84D:#3FE0C5:#3A7DFF><bold>✦ Nomonom ✦</bold></gradient></shadow>"
    font: shift_1



  # NEW: styled ping (pink)
  ping:
    text: "<shadow:#000000:0.6><gray>Ping:</gray> <gradient:#FF5EDC:#FF9FD7><bold>%player_ping%ms</bold></gradient></shadow>"
    font: shift_1

  # NEW: prettier money using CMI balance placeholder
  money_pretty:
    text: "<shadow:#000000:0.6><gray>Balance:</gray> <gradient:#FFD84D:#F5D36A><bold>%cmi_user_balance%</bold></gradient></shadow>"
    font: shift_1


  # Keep your original right-HUD money placeholder untouched
  money:
    text: "%cmi_user_balance%"
    font: shift_2

# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/switch-text
switch-text:
  nameplate_color_prefix:
    switch: "%np_equipped_nameplate%"
    default: ""
    case:
      'halloween': "<gradient:#FF0000:#000000:%np_gradient_3%>"
      'hutao': "<gradient:#FFFFFF:#FF4500:%np_gradient_3%>"
      'rabbit': "<gradient:#FFFFFF:#DB7093:%np_gradient_3%>"
      'starsky': "<gradient:#FFFFF0:#696969:%np_gradient_3%>"
      'trident': "<gradient:#E1FFFF:#008B8B:%np_gradient_10%>"
      'egg': "<gradient:#FFFFFF:#FFA500:%np_gradient_5%>"
      'xmas': "<WHITE>"
      'angel': "<#8B4513>"
      'sign': "<BLACK>"
      'banner': "<WHITE>"
      'enter': "<WHITE>"

  nameplate_color_suffix:
    switch: "%np_equipped_nameplate%"
    default: ""
    case:
      'halloween': "</gradient>"
      'hutao': "</gradient>"
      'rabbit': "</gradient>"
      'starsky': "</gradient>"
      'trident': "</gradient>"
      'egg': "</gradient>"
      'xmas': "</WHITE>"
      'angel': "</#8B4513>"
      'sign': "</BLACK>"
      'banner': "</WHITE>"
      'enter': "</WHITE>"

  world:
    switch: '%player_world%'
    case:
      'world': "<green>Overworld</green>"
      'world_nether': "<red>The Nether</red>"
      'world_the_end': "<red>The End</red>"
    default: "<gray>Unknown world</gray>"

# https://mo-mi.gitbook.io/xiaomomi-plugins/customnameplates/plugin-wiki/customnameplates/custom-placeholders/vanilla-hud
vanilla-hud:
  stamina_hud:
    reverse: true
    images:
      empty: stamina_0
      half: stamina_1
      full: stamina_2
    placeholder:
      value: '1.1'
      max-value: '2'
