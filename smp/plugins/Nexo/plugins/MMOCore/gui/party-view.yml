
# GUI display name
name: '<shift:-33><glyph:vs_mmocorepackgui_party_view_top><shift:-226><glyph:vs_mmocorepackgui_party_view_bottom>'

# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 54

items:
    member:
        slots: [11,12,13,14,15,21,22,23]
        function: member
        empty:  
            item: AIR
        member:
            item: PLAYER_HEAD
            name: '&a{name}'
            lore:
            - '&7Level {level} {class}'
            - '&7Online Since: {since}'
    leave:
        slots: [41]
        function: leave
        item: PAPER
        custom-model-data: 10921
        name: '&cLeave Party'
        lore: {}
    request:
        slots: [39]
        function: invite
        item: PAPER
        custom-model-data: 10920
        name: '&aInvite a player..'
        lore: {}